allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
overrides:
  # GHSA-wq5f-xc86-pv6w (high, librsvg CVE-2026-96889): sharp below 0.35.5.
  sharp: 0.35.5
  # GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr (moderate), GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp (low),
  # fixed in 3.1.9.
  fast-uri: ^3.1.9
  # GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx and GHSA-qrxm-fqhp-jwvm (high),
  # plus four moderates, all fixed in 7.30.1. Caret keeps the 7.x line.
  undici: ^7.30.1
  # GHSA-2vr4-cq9g-pvrc, GHSA-rpw4-54j3-4h4q, GHSA-h3mg-xc3c-68pw and GHSA-j6r3-76f7-8jcv,
  # all moderate, fixed in 10.7.1; GHSA-rxp7-6hxx-x8q5 (moderate), fixed in 10.7.4.
  ip-address: ^10.7.4
  # Caret on 4.x: every dependent asks for ^4, and the former >= floor resolved 5.2.3,
  # the line GHSA-r3ph-w7gj-g6xm (moderate) affects.
  js-yaml: ^4.3.2
  postcss: '>=8.5.25'
  'nanoid@3': '^3.3.18'
  # GHSA-hxh3-vqpv-xpqv (moderate), fixed in 4.13.7; GHSA-5r4p-p66f-jhc7 (moderate), fixed in 4.13.11.
  hono: 4.13.16
  # GHSA-6qxp-vccf-f47h (high): shadcn's MCP SDK below 1.31.0 could send OAuth credentials elsewhere.
  '@modelcontextprotocol/sdk': ^1.31.0
  # GHSA-rmxm-3fg6-px4f (moderate), fixed in 2.1.3.
  '@hono/node-server': ^2.1.3
  # GHSA-6j4f-fj2g-mc7p (<1.1.19) and GHSA-qhr7-859c-m2p7 (<1.1.20), both high.
  'brace-expansion@1': 1.1.21
  # The same two advisories on the 4.x/5.x line: <5.0.10 and <5.0.11. Caret, not a bare
  # floor, so a future major cannot be pulled in the way >= did for fast-uri (#1873).
  'brace-expansion@>=3': ^5.0.11
  # GHSA-6pq8-jhm2-2vcw (moderate), fixed in 6.16.1.
  'qs@<6.16.1': ^6.16.1
  # GHSA-c8x8-7fp4-3x9w (high, XSS): the editor's prosemirror-view, pulled by @tiptap/pm, below 1.42.3.
  prosemirror-view: ^1.42.3
  # One prosemirror-model for every ProseMirror package: prosemirror-view 1.42.5+ needs ^1.25.12,
  # and two copies break ProseMirror's Fragment/Node identity checks ("multiple versions of
  # prosemirror-model were loaded") on reparse, paste, drop and collaboration.
  prosemirror-model: ^1.25.12
  # GHSA-587h-7wmj-h5pm (high): vitest pulls vite 8.0.0 to 8.1.5; fixed in 8.1.6. Caret keeps 8.x.
  vite: ^8.1.6
  # GHSA-68fv-2mgg-jv7q (high): next > postcss > source-map-js below 1.2.2.
  source-map-js: ^1.2.2
  # GHSA-jqcg-44mw-7w3h (critical): shadcn > MCP SDK > express > proxy-addr below 2.0.8.
  proxy-addr: ^2.0.8
  # GHSA-27r3-jxmh-p828 (high): shadcn > MCP SDK > express > body-parser below 2.4.0.
  'body-parser@2': ^2.4.0
  # GHSA-3f7j-7jwc-fxfj (high) and two lower advisories: shadcn > dotenvx > systeminformation below 5.33.16.
  systeminformation: ^5.33.16
  # GHSA-mrhx-c7xc-m3w5 (high): zod below 4.6.6, with no patched 3.x release. shadcn needs ^4.22.0 for
  # this: older releases declare zod 3 and crash on zod 4 at load (deepPartial was removed).
  zod: ^4.6.6
  'baseline-browser-mapping@<2.11.0': 2.11.0
  # GHSA-253c-mchw-3w2r (moderate): quadratic linkify paths, fixed in 14.3.1.
  markdown-it: ^14.3.3
  # GHSA-rj75-hqrm-r3gf (moderate): quadratic flat-selector parsing, fixed in 7.1.6.
  postcss-selector-parser: ^7.1.6
  # React's optional menu ranges otherwise select releases with newer exact core/PM peers.
  '@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/extension-floating-menu': 3.30.5
# Supply-chain resolution policy (#835). Owner decision 2026-09-19: versions younger
# than one day and versions without registry publish time are refused, and a
# package whose trust evidence (staged publish, trusted publisher, provenance)
# drops versus an earlier release fails resolution. Emergency admissions are
# exact-version entries in minimumReleaseAgeExclude, each owner-approved and
# commented with the advisory, the approver, and the removal condition; see
# "Package manager supply-chain policy" in frontend/AGENTS.md for the procedure.
# .github/scripts/check-pnpm-supply-chain-policy.py enforces this block in CI.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Exact versions exempt from no-downgrade, each a verified legacy-line backport.
trustPolicyExclude:
  # The same maintainer's 3.x maintenance release after 4.2.6 started shipping
  # provenance; pulled in by eslint-config-next.
  # Publisher: jounqin. Line: 3.x. Published: 2025-04-21.
  # Remove once eslint-config-next moves to 4.x.
  - eslint-import-resolver-typescript@3.10.1
  # The npm team's legacy-line backport of the CVE-2022-25883 ReDoS fix, published
  # without provenance after the 7.5.x line gained it; the backport, not a takeover,
  # trips no-downgrade.
  # Publisher: lukekarrys. Line: 6.x. Published: 2023-07-10.
  # Remove once nothing in the lockfile resolves semver@6.
  - semver@6.3.1
# Advisories pnpm audit tolerates. Each has no patched release and cannot be reached
# from runtime code or user input; each entry is owner-approved and commented with the
# reason, the approver, and the removal condition (frontend/AGENTS.md has the procedure).
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion from deeply nested patterns (CVE-2026-93687), high,
    # with no patched release. Reached only through shadcn's CLI and eslint-config-next,
    # which expand developer-written globs; no app code imports either (#1969).
    # Approved: Hunter Nakagawa, 2026-10-09.
    # Remove once braces ships a fix and pnpm audit passes without this entry, or
    # re-review it as soon as anything other than shadcn and eslint-config-next depends on braces.
    - GHSA-vfj7-8cjw-p6xm
