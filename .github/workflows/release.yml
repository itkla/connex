name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build & publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive product version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/connex-${{ matrix.component }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/connex-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/connex-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/connex-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Attest SBOM to image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/connex-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --predicate "sbom-${{ matrix.component }}.spdx.json" --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.spdx.json

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom-*.spdx.json
          body: |
            Connex ${{ needs.images.outputs.version }} — version-locked backend + frontend image pair.

            Images (immutable, cosign-signed, SBOM-attested):
            - `ghcr.io/${{ github.repository_owner }}/connex-backend:${{ needs.images.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/connex-frontend:${{ needs.images.outputs.version }}`
