name: Resolve PR 851 branch

on:
  push:
    branches:
      - docs/agent-resource-discipline
    paths:
      - .github/workflows/resolve-pr-851.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: docs/agent-resource-discipline
      - name: Merge main and apply reviewed guide resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X theirs origin/main -m "Merge main into docs/agent-resource-discipline"

          python3 <<'PY'
          from pathlib import Path

          def replace_any(text: str, candidates: list[str], replacement: str, label: str) -> str:
              for candidate in candidates:
                  if candidate in text:
                      return text.replace(candidate, replacement, 1)
              raise SystemExit(f"Missing expected text for {label}")

          root_path = Path("AGENTS.md")
          root = root_path.read_text()
          if "Node `^22.13.0 || >=24.0.0`" not in root:
              raise SystemExit("Current main Node floor was not preserved")
          if "Comments are docs only — in Java and TypeScript" not in root:
              raise SystemExit("Current main comment-policy clarification was not preserved")

          root = replace_any(
              root,
              [
                  "7. **Skills are mandatory when their scope matches** (see [Skills](#skills)). Independent, risk-tiered review is mandatory (see [Review](#review)).",
                  "7. **Skills are mandatory for UI work** (see [Skills](#skills)). Reviews are mandatory (see [Review](#review)).",
              ],
              "7. **Scoped design and review skills are mandatory when their scope matches** (see [Skills](#skills) and [Review](#review)). `/verify` and `/run` remain optional unless a package guide explicitly requires them. Independent, risk-tiered review is mandatory.",
              "Golden Rule 7",
          )

          rule_11 = "11. **Report honestly and concisely.** Say what you did, what you didn't, and what you couldn't verify. If tests fail, show the output. Never claim something works or is done when you haven't confirmed it."
          rule_12 = "12. **Use agent capacity deliberately.** High scrutiny comes from precise charters, independent challenge, and executable evidence — not from unlimited fan-out. Follow the delegation budget below."
          if rule_12 not in root:
              if rule_11 not in root:
                  raise SystemExit("Could not restore Golden Rule 12")
              root = root.replace(rule_11, f"{rule_11}\n{rule_12}", 1)

          if "## Delegation — budgeted depth, not unlimited fan-out" not in root:
              old_workflow = """## Workflow: Explore → Plan → Question → Argue → Act

For any non-trivial task:

1. **Explore** — fan out `Explore`/`general-purpose` agents (in parallel) to map the relevant code, patterns, and naming. Ground every decision in real code, not assumptions.
2. **Plan** — use the `Plan` agent or write a short plan for multi-file or architectural work. Identify the files you'll touch and the order. Capture any plan worth persisting as a GitHub issue (see [Git & issues](#git--issues)), not a markdown file in the repo.
3. **Question & argue** — state your assumptions. If something in the request conflicts with the codebase, the design system, or good engineering, say so and propose the better path. Disagreement is expected; silent compliance with a bad idea is not.
4. **Act** — implement, matching existing patterns.

## Delegation — use subagents and workflows liberally

This repo favors **aggressive parallel fan-out**. Reach for subagents and workflows by **default, not as a last resort** — if a task can be split, split it. Token cost is acceptable here; missed coverage and slow serial work are not. Scale the fan-out to the task (don't spin up a fleet for a one-line edit), but when in doubt, delegate.

**Subagents** (the `Agent` tool) — the default for anything parallelizable:

- **Search / understand many files** → multiple `Explore` agents in one message, each on a different angle (by feature, by layer, by entity).
- **Design a multi-step change** → the `Plan` agent.
- **Independent workstreams** → spawn them concurrently (one message, multiple `Agent` calls). When several agents mutate files in parallel, isolate them in worktrees.
- **Review** → fan out independent reviewers adversarially (see [Review](#review)).

**Workflows** (the `Workflow` tool) — for larger, multi-phase, or structured work where you want deterministic orchestration: understand → design → implement → review, broad audits, migrations across many files, or adversarial verify panels. **This AGENTS.md is your standing opt-in** — you don't need to ask before running a workflow when the task warrants it. Run one phase at a time, read the result, then decide the next.

**Model routing:**

- **Backend work → codex.** Defer backend work to a **gpt-5.6** agent at **xhigh** reasoning effort spawned via the **codex** CLI. Claude handles the frontend and gap-filling where necessary.
- **Fundamental changes → Fable 5 advisor.** For high-level work that involves fundamental changes, consult a **Fable 5** subagent as an advisor before acting.

**Plan-first dispatch (non-negotiable).** Every subagent dispatched to *implement* something — Claude or codex — must produce a short plan **before** writing code: scope and approach, files to touch, API/data contracts, migration versions (pre-assigned by the orchestrator to avoid Flyway collisions), and a test plan. The orchestrator reviews that plan against the codebase and these guides, corrects it if needed, and only then lets implementation proceed — for codex this means a read-only planning run first, then an implementation run with the approved plan embedded. Pure discovery, review, and verification agents are exempt.

Default to delegating discovery, review, and any wide sweep. Keep synthesis and the actual edits coherent in one place. If you're the fork/subagent, execute directly — don't re-delegate.
"""
              new_workflow = """## Workflow: Explore → Plan → Question → Argue → Act

For any non-trivial task:

1. **Explore** — inspect the issue, neighboring code, existing patterns, `git diff`, and targeted searches first. Delegate exploration only when separate scopes genuinely benefit from independent context; do not ask several agents to map the same files.
2. **Plan** — the orchestrator writes the short plan by default for multi-file work. Identify files, contracts, risks, order, and verification. Use a dedicated Plan agent only when architecture is genuinely unresolved. Capture any plan worth persisting as a GitHub issue (see [Git & issues](#git--issues)), not a markdown file in the repo.
3. **Question & argue** — state your assumptions. If something in the request conflicts with the codebase, the design system, or good engineering, say so and propose the better path. Disagreement is expected; silent compliance with a bad idea is not.
4. **Act** — implement, matching existing patterns.

## Delegation — budgeted depth, not unlimited fan-out

Quality is measured by the strength of the evidence and the independence of the challenge, not by the number of agents used. Prefer deterministic inspection, tests, browser runs, and focused review over duplicate broad exploration.

Before dispatching subagents, include a short **delegation budget** in the task plan: risk tier, maximum dispatches, unique charters, and mutating lanes. A dispatch is a new subagent or workflow run.

### Default task tiers

- **Tier 0 — trivial:** a one-line fix, a mechanically obvious local edit, or genuinely trivial docs/copy. **Substantive guide, runbook, policy, security, or architecture documentation is never Tier 0.** **0 subagent dispatches.** Self-review and the smallest relevant deterministic check.
- **Tier 1 — narrow:** one layer, a small file set, known pattern, no security-sensitive invariant. **Up to 2 dispatches total:** normally one implementation/discovery owner and one independent reviewer. The orchestrator plans.
- **Tier 2 — broad:** cross-layer feature, migration, substantial refactor, or uncertain integration contract. **Up to 4 dispatches total:** normally one scoped explorer, up to two layer owners, and one independent reviewer; alternatively two explorers, one implementation owner, and one reviewer. Trade lanes rather than stacking all of them.
- **Tier 3 — critical:** auth, WebAuthn, tenancy/routing, RBAC/sharing, secrets/crypto, provider egress or sync, destructive data movement, money/approvals, concurrency/locking, deployment/release, or a fundamental architecture change. **Up to 6 dispatches total:** no more than two discovery lanes, two mutating lanes, and two reviewers with different charters.

Exceed a tier budget only when a concrete uncovered risk remains. State that risk and the extra agent's unique deliverable before dispatch. “More confidence” is not a sufficient reason.

### Dispatch rules

- **Default concurrency is two subagents.** Use at most one mutating agent per layer and no more than two mutating worktrees for a task. Review agents are read-only.
- **Every agent gets a unique charter.** Scope by files, layer, invariant, or failure class. Never send multiple agents the same generic “review everything” prompt.
- **Batch adjacent questions.** One well-scoped exploration that covers a coherent area is better than five tiny agents rediscovering the same context.
- **Reuse a context packet.** Pass the issue, approved plan, relevant file list, contracts, prior findings, and test evidence forward. Do not pay repeatedly to rediscover settled facts.
- **No recursive delegation.** A subagent executes its assignment directly and does not spawn another fleet.
- **Use deterministic tools first.** `rg`, focused diffs, tests, compiler output, browser traces, and SQL/API checks answer many questions more reliably and cheaply than another opinion.
- **Stop when the evidence is sufficient.** Once acceptance criteria pass, required checks are green, and the mandated independent review has no unresolved high-severity finding, do not keep spawning agents to seek consensus.

### Subagents and workflows

- **Search / understand many files** → use one scoped explorer first; add a second only for a genuinely separate layer or invariant.
- **Design a multi-step change** → the orchestrator plans; use a Plan agent only for Tier 2–3 ambiguity that remains after repository inspection.
- **Independent workstreams** → parallelize only when contracts are already settled and file/migration ownership does not overlap. Isolate mutators in worktrees.
- **Review** → use one adversarial reviewer for standard work; add a second only for a distinct Tier 3 concern (see [Review](#review)).
- **Workflows** → reserve for Tier 3, multi-phase work where deterministic orchestration replaces equivalent standalone dispatches. Do not run a workflow and a parallel set of agents that duplicate its phases. Run one phase, read the result, then decide whether the next phase is still necessary.

### Model routing

- **Backend work → codex.** Use a **gpt-5.6** agent at **high** reasoning effort for routine backend implementation and review. Use **xhigh** only for Tier 3 work or when a failed/ambiguous first pass proves the extra reasoning is necessary.
- **Frontend work → Claude/current orchestrator.** Keep one implementation owner and use existing reference pages plus the smallest matching design-skill pipeline.
- **Fundamental changes → Fable 5 advisor only when the change truly alters a product or architecture invariant.** Do not invoke it merely because an issue is large.

### Plan-first dispatch

Every subagent dispatched to implement something receives an approved short plan before editing: scope and approach, files to touch, API/data contracts, migration versions where applicable, and a test plan.

- The orchestrator should produce that plan directly for Tier 1 and most Tier 2 work.
- Do not spend a separate Plan-agent run merely to restate an already approved orchestrator plan.
- A separate read-only planning pass is required for Tier 3 work, unresolved cross-layer contracts, destructive migrations, or other cases where implementation should not begin until an independent plan is reviewed.
- Pure discovery, review, and verification agents are exempt.

Keep synthesis and the final edits coherent in one place. If you're the fork/subagent, execute directly — don't re-delegate.
"""
              if old_workflow not in root:
                  raise SystemExit("Could not restore budgeted delegation section")
              root = root.replace(old_workflow, new_workflow, 1)

          root = replace_any(
              root,
              [
                  "- **Tier 0 — trivial:** docs/copy, a one-line fix, or a mechanically obvious local edit. **0 subagent dispatches.** Self-review and the smallest relevant deterministic check.",
                  "- **Tier 0 — trivial:** a one-line fix, a mechanically obvious local edit, or genuinely trivial docs/copy. **Substantive guide, runbook, policy, security, or architecture documentation is never Tier 0.** **0 subagent dispatches.** Self-review and the smallest relevant deterministic check.",
              ],
              "- **Tier 0 — trivial:** a one-line fix, a mechanically obvious local edit, or genuinely trivial docs/copy. **Substantive guide, runbook, policy, security, or architecture documentation is never Tier 0.** **0 subagent dispatches.** Self-review and the smallest relevant deterministic check.",
              "Tier 0",
          )

          root = replace_any(
              root,
              [
                  "Skills are **mandatory when the change matches their documented scope.** Always run them **before** building, not after. Use the smallest pipeline that covers the risk; do not stack overlapping skills by reflex.",
                  "Skills are **mandatory for all frontend / UI / design work.** Always run them **before** building, not after. Which skills depends on scope:",
              ],
              "Design skills are **mandatory when the change matches their documented scope.** Always run them **before** building, not after. Use the smallest pipeline that covers the risk; do not stack overlapping skills by reflex.",
              "skills introduction",
          )
          root = replace_any(
              root,
              [
                  "Skills are also encouraged elsewhere when one clearly fits (e.g. `/code-review`, `/security-review`, `/verify`, `/run`). One skill may satisfy the independent-review requirement when its charter covers the actual risk; do not automatically duplicate it with a generic reviewer.",
                  "Skills are also encouraged elsewhere when one clearly fits (e.g. `/code-review`, `/security-review`, `/verify`, `/run`). When a skill matches, invoke it **before** doing the work, not after.",
              ],
              "Review skills are mandatory when [Review](#review) requires them; a matching review skill may satisfy the independent-review requirement, so do not automatically duplicate it with a generic reviewer. `/verify` and `/run` are optional unless a package guide explicitly requires them.",
              "non-design skill guidance",
          )
          root_path.write_text(root)

          frontend_path = Path("frontend/AGENTS.md")
          frontend = frontend_path.read_text()
          frontend = replace_any(
              frontend,
              [
                  "The root [`/AGENTS.md`](../AGENTS.md) applies here in full. This file adds frontend-specific rules. The Golden Rules — Explore→Plan→Question→Act, match existing patterns, docs-only comments, strict types, mandatory skills, mandatory review — are not optional here.",
                  "The root [`/AGENTS.md`](../AGENTS.md) applies here in full. This file adds frontend-specific rules. The Golden Rules — Explore→Plan→Question→Act, match existing patterns, docs-only comments, strict types, scoped skills, and independent risk-tiered review — are not optional here.",
              ],
              "The root [`/AGENTS.md`](../AGENTS.md) applies here in full. This file adds frontend-specific rules. The Golden Rules — Explore→Plan→Question→Act, match existing patterns, docs-only comments, strict types, scoped skills, and independent risk-tiered review — are not optional here.",
              "frontend introduction",
          )
          frontend = replace_any(
              frontend,
              ["## Skills are mandatory for UI work", "## Skills are mandatory when their scope matches"],
              "## Skills are mandatory when their scope matches",
              "frontend skill heading",
          )
          frontend = replace_any(
              frontend,
              [
                  "Which skills you run depends on the scope of the change. Always run them **before** building, not after.",
                  "Always run the smallest design-skill pipeline that covers the actual change, and run it **before** building. Do not spend three overlapping design passes on a routine component that extends an established pattern.",
              ],
              "Always run the smallest design-skill pipeline that covers the actual change, and run it **before** building. Do not spend three overlapping design passes on a routine component that extends an established pattern.",
              "frontend skill scope",
          )
          frontend = replace_any(
              frontend,
              ["### Full pipeline — new pages, redesigns, net-new components", "### Full pipeline — new pages, redesigns, or a new interaction/visual system"],
              "### Full pipeline — new pages, redesigns, or a new interaction/visual system",
              "frontend full pipeline",
          )
          frontend = replace_any(
              frontend,
              ["### Small in-place edits — tweaks to existing UI", "### Focused pipeline — routine components and in-place edits"],
              "### Focused pipeline — routine components and in-place edits",
              "frontend focused pipeline heading",
          )
          frontend = replace_any(
              frontend,
              [
                  "For minor changes to existing components/pages (spacing, copy, a single prop, a small style fix), run **`emil-design-eng`** only — skip `impeccable` and `design-taste-frontend`. If the \"small\" edit turns out to touch hierarchy, layout, or IA, stop and escalate to the full pipeline.",
                  "For components that clearly extend an existing page/component pattern, or minor changes to existing UI (spacing, copy, a prop, a small style fix), run **`emil-design-eng`** only and ground the change in the live reference page. Skip `impeccable` and `design-taste-frontend` unless the work changes hierarchy, layout, information architecture, or establishes a reusable visual/interaction pattern. If it does, stop and escalate to the full pipeline.",
              ],
              "For components that clearly extend an existing page/component pattern, or minor changes to existing UI (spacing, copy, a prop, a small style fix), run **`emil-design-eng`** only and ground the change in the live reference page. Skip `impeccable` and `design-taste-frontend` unless the work changes hierarchy, layout, information architecture, or establishes a reusable visual/interaction pattern. If it does, stop and escalate to the full pipeline.",
              "frontend focused pipeline",
          )

          if "## Delegated frontend work" not in frontend:
              old_delegation = """## Delegated work is plan-first

Any subagent dispatched to implement frontend work must first return a short plan — components/files to touch, design-system pieces reused, state/URL contracts, i18n keys, and the browser-verification steps — and get it reviewed by the orchestrator before editing code (see the root `AGENTS.md` → *Plan-first dispatch*). Discovery, review, and verification agents are exempt.
"""
              new_delegation = """## Delegated frontend work

Follow the root delegation tiers and budget.

- The orchestrator writes the plan for Tier 1 and most Tier 2 frontend changes; do not dispatch a separate Plan agent to restate settled page/component contracts.
- Use one mutating frontend owner. Split a second mutating lane only when the API contract is fixed and the file sets do not overlap.
- Give every frontend agent exact routes, components, reference pages, state/URL contracts, i18n keys, responsive states, and browser-verification steps.
- Reuse one context packet and one running browser session for related flows. Do not send several agents to rediscover the same reference page or repeat the same Playwright journey.
- Standard frontend work needs one independent adversarial review. Add a second review only for a distinct Tier 3 concern such as auth/session, permission visibility, cross-workspace state, destructive bulk behavior, or a release-critical migration.

Any subagent dispatched to implement frontend work must receive the approved plan before editing: components/files to touch, design-system pieces reused, state/URL contracts, i18n keys, and browser-verification steps. Discovery, review, and verification agents are exempt.
"""
              if old_delegation not in frontend:
                  raise SystemExit("Could not restore frontend delegation guidance")
              frontend = frontend.replace(old_delegation, new_delegation, 1)

          isolated_line = "   - **Run the Playwright MCP in `--isolated` mode.** Several agents share this one clone, and Chrome lets only one process hold a profile at a time — the default shared profile serializes browsing to a single agent and fails the rest with `Browser is already in use for …/mcp-chrome-… use --isolated`. With `--isolated`, each agent gets its own fresh browser profile/context, so concurrent verification doesn't collide. Configure it where the server is registered, e.g. `npx @playwright/mcp@latest --isolated` (add `--headless` for CI/headless runs). Trade-off: an isolated profile starts logged-out, so make session login part of the verification flow (hit `/auth/login`, authenticate, then drive the page) rather than relying on a persisted session."
          coverage_line = "   - Cover every materially changed path in one coherent verification pass where practical; duplicate browser runs are not a substitute for broader state coverage."
          if coverage_line not in frontend:
              if isolated_line not in frontend:
                  raise SystemExit("Could not add coherent frontend verification guidance")
              frontend = frontend.replace(isolated_line, f"{isolated_line}\n{coverage_line}", 1)
          frontend = replace_any(
              frontend,
              [
                  "4. `/code-review` **and** adversarial multi-agent review; address findings. Auth, invite, sharing, or permissions UI changes also get `/security-review`.",
                  "3. `/code-review` **and** adversarial multi-agent review; address findings. Auth, invite, sharing, or permissions UI changes also get `/security-review`.",
                  "3. Self-review the diff, then run **one independent adversarial review**. A matching `/code-review` satisfies this requirement. Auth, invite, sharing, cross-workspace state, or permissions UI changes additionally get `/security-review`; add a second reviewer only when the root Tier 3 rules require a distinct charter.",
              ],
              "4. Self-review the diff, then run **one independent adversarial review**. A matching `/code-review` satisfies this requirement. Auth, invite, sharing, cross-workspace state, or permissions UI changes additionally get `/security-review`; add a second reviewer only when the root Tier 3 rules require a distinct charter.",
              "frontend review gate",
          )
          if "2. **Run the test harness.**" not in frontend:
              raise SystemExit("Current main frontend test-harness guidance was not preserved")
          frontend_path.write_text(frontend)

          backend_path = Path("backend/AGENTS.md")
          backend = backend_path.read_text()
          backend = replace_any(
              backend,
              [
                  "The root [`/AGENTS.md`](../AGENTS.md) applies here in full. This file adds backend-specific rules. The Golden Rules — Explore→Plan→Question→Act, match existing patterns, docs-only comments, strict null/type safety, layered architecture, mandatory review — are not optional here.",
                  "The root [`/AGENTS.md`](../AGENTS.md) applies here in full. This file adds backend-specific rules. The Golden Rules — Explore→Plan→Question→Act, match existing patterns, docs-only comments, strict null/type safety, layered architecture, and independent risk-tiered review — are not optional here.",
              ],
              "The root [`/AGENTS.md`](../AGENTS.md) applies here in full. This file adds backend-specific rules. The Golden Rules — Explore→Plan→Question→Act, match existing patterns, docs-only comments, strict null/type safety, layered architecture, and independent risk-tiered review — are not optional here.",
              "backend introduction",
          )
          if "## Delegated backend work" not in backend:
              delegated_backend = """## Delegated backend work

Follow the root risk tiers and dispatch budgets. Backend depth must come from exact contracts, tests, and targeted independent review rather than a fleet of agents repeating the same mapper/service search.

Any implementation agent, including Codex, receives an approved plan before editing: scope/approach, exact REST contract (paths, DTOs, error cases, RBAC + tenant scoping), migration DDL with the orchestrator-assigned Flyway version, files per layer (controller/service/mapper/XML/tests), and a test plan.

- The orchestrator writes the plan for Tier 1 and most Tier 2 work. Do not run a separate read-only planning agent merely to echo it.
- Use a separate read-only planning pass for Tier 3 work, unresolved transaction/locking design, cross-plane data movement, destructive migrations, or a genuinely unsettled cross-layer contract.
- Keep one backend implementation owner. Split another mutating lane only when migration numbers, contracts, and file ownership are fixed and non-overlapping.
- Standard backend work receives one independent read-only review. Tier 3 work receives the root two-reviewer split: security/tenant concerns and correctness/concurrency/migration safety.
- Discovery, review, and verification agents are exempt from producing an implementation plan, but they still receive a narrow unique charter.

"""
              marker = "## Definition of Done (backend) — the verify loop is required"
              if marker not in backend:
                  raise SystemExit("Could not insert backend delegation guidance")
              backend = backend.replace(marker, delegated_backend + marker, 1)

          backend = replace_any(
              backend,
              [
                  "6. **Tier 3 escalation only.** For auth/WebAuthn, tenant routing, RBAC/sharing, secrets/crypto, provider egress/sync, destructive data movement, money/approvals, concurrency/locking, or release-critical work, rerun the security/tenant charter at **xhigh**, add `/security-review`, and use one second reviewer focused on correctness/concurrency/migration safety. Do not add further reviewers unless the two disagree or a concrete high-risk question remains unresolved.",
                  "6. **Tier 3 escalation only.** For auth/WebAuthn, tenant routing, RBAC/sharing, secrets/crypto, provider egress/sync, destructive data movement, money/approvals, concurrency/locking, or release-critical work, use `/security-review` for the security/tenant slot and one fresh **gpt-5.6/xhigh** Codex review focused on correctness/concurrency/migration safety. Do not add further reviewers unless the two disagree or a concrete high-risk question remains unresolved.",
              ],
              "6. **Tier 3 escalation only.** For auth/WebAuthn, tenant routing, RBAC/sharing, secrets/crypto, provider egress/sync, destructive data movement, money/approvals, concurrency/locking, or release-critical work, use `/security-review` for the security/tenant slot and one fresh **gpt-5.6/xhigh** Codex review focused on correctness/concurrency/migration safety. Do not add further reviewers unless the two disagree or a concrete high-risk question remains unresolved.",
              "backend Tier 3 review split",
          )
          if "Seeder startup must use the dedicated `SeederApplication` launcher" not in backend:
              raise SystemExit("Current main backend seeder guidance was not preserved")
          backend_path.write_text(backend)

          ocr = Path("ocr/AGENTS.md").read_text()
          if "## Delegation and review" not in ocr:
              raise SystemExit("OCR delegation guidance was not preserved")

          for path in [root_path, frontend_path, backend_path, Path("ocr/AGENTS.md")]:
              text = path.read_text()
              if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
                  raise SystemExit(f"Conflict marker left in {path}")
              if text.count("```") % 2:
                  raise SystemExit(f"Unbalanced Markdown fences in {path}")
              if any(line.rstrip() != line for line in text.splitlines()):
                  raise SystemExit(f"Trailing whitespace in {path}")
          PY

          rm .github/workflows/resolve-pr-851.yml
          git add AGENTS.md backend/AGENTS.md frontend/AGENTS.md ocr/AGENTS.md .github/workflows/resolve-pr-851.yml
          git diff --cached --check
          git commit -m "docs: resolve agent-guide review feedback"
          git push origin HEAD:docs/agent-resource-discipline
