name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  ocr:
    name: OCR — contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install lightweight image test dependencies
        run: python -m pip install Pillow==12.3.0 numpy==2.3.5
      - name: Install pinned OCR lock compiler
        run: python -m pip install pip-tools==7.5.3
      - name: Regenerate the deployable OCR lock
        working-directory: ocr
        run: |
          pip-compile \
            --generate-hashes \
            --strip-extras \
            --allow-unsafe \
            --output-file=requirements.lock \
            requirements.txt
          git diff --exit-code -- requirements.lock
      - name: Test service protocol and benchmark manifest
        working-directory: ocr
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Build deployable OCR image
        run: docker build --tag connex-ocr-ci ocr
      - name: Smoke-test deployable OCR service
        run: bash ocr/ci/smoke_image.sh connex-ocr-ci

  migrations:
    name: Migrations — forward-only guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Forbid modifying or deleting shipped migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/check-migration-immutability.sh "$BASE_SHA" HEAD
      - name: Regression-test migration immutability guard
        run: bash .github/scripts/test-migration-immutability.sh

  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-root
          MYSQL_DATABASE: connexdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-${{ github.run_id }}-${{ github.run_attempt }}-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      CONNEX_DB_URL: jdbc:mysql://127.0.0.1:3306/connexdb?sslMode=DISABLED
      CONNEX_DB_USERNAME: root
      CONNEX_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 26
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Allow non-SUPER routine creation under binary logging
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pci-${{ github.run_id }}-${{ github.run_attempt }}-root -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Test (runs Flyway migrations, arch tests, tenant-isolation tests)
        working-directory: backend
        run: bash gradlew test --no-daemon --stacktrace

  frontend:
    name: Frontend — typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        working-directory: frontend
        run: node_modules/.bin/tsc --noEmit
      - name: Lint changed files
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — skipping changed-file lint."
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only --relative --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.ts' '*.tsx'); then
            echo "git diff against base $BASE_SHA failed — failing rather than silently skipping the lint gate."
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "No changed frontend TS/TSX files — nothing to lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$CHANGED"
          mapfile -t FILES <<< "$CHANGED"
          node_modules/.bin/eslint "${FILES[@]}"
      - name: Build deployable frontend image
        run: docker build --tag connex-frontend-ci frontend
      - name: Smoke-test standalone image optimization
        run: bash frontend/ci/smoke_image.sh connex-frontend-ci

  frontend-tests:
    # Non-required while the suite proves itself stable (see #853); do not add to
    # branch protection until it has run green for a week.
    name: Frontend — unit & e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-e2e-root
          MYSQL_DATABASE: connexdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-${{ github.run_id }}-e2e-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild sharp
      - name: Unit tests (vitest)
        working-directory: frontend
        run: node_modules/.bin/vitest run
      - name: Set up JDK 26
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Allow non-SUPER routine creation under binary logging
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pci-${{ github.run_id }}-e2e-root -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Build bootWar
        working-directory: backend
        run: bash gradlew bootWar --no-daemon -Pversion=ci
      - name: Boot backend (dev profile, fresh schema)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          CONNEX_DB_URL: jdbc:mysql://127.0.0.1:3306/connexdb?sslMode=DISABLED
          CONNEX_DB_USERNAME: root
          CONNEX_DB_PASSWORD: ci-${{ github.run_id }}-e2e-root
        run: |
          set -euo pipefail
          WAR=$(find build/libs -name '*.war' ! -name '*-plain.war' | head -1)
          nohup java -jar "$WAR" > /tmp/e2e-backend.log 2>&1 &
          echo $! > /tmp/e2e-backend.pid
          BOOTED=0
          for _ in $(seq 1 240); do
            if curl -sf http://localhost:8080/api/version > /dev/null 2>&1; then BOOTED=1; break; fi
            if ! kill -0 "$(cat /tmp/e2e-backend.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$BOOTED" != 1 ]; then
            echo "::error::backend failed to boot for the e2e suite"
            tail -80 /tmp/e2e-backend.log
            exit 1
          fi
      - name: Build and start frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          node_modules/.bin/next build
          nohup node_modules/.bin/next start > /tmp/e2e-frontend.log 2>&1 &
          echo $! > /tmp/e2e-frontend.pid
          READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3000/auth/login > /dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$(cat /tmp/e2e-frontend.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            echo "::error::frontend failed to start for the e2e suite"
            tail -40 /tmp/e2e-frontend.log
            exit 1
          fi
      - name: Install Playwright Chromium
        working-directory: frontend
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        working-directory: frontend
        run: node_modules/.bin/playwright test
      - name: Surface server logs on failure
        if: failure()
        run: |
          echo "=== backend (tail) ==="; tail -100 /tmp/e2e-backend.log 2>/dev/null || true
          echo "=== frontend (tail) ==="; tail -60 /tmp/e2e-frontend.log 2>/dev/null || true
      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
