name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: connexdb
          MYSQL_USER: connexuser
          MYSQL_PASSWORD: connexpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      CONNEX_DB_URL: jdbc:mysql://127.0.0.1:3306/connexdb
      CONNEX_DB_USERNAME: connexuser
      CONNEX_DB_PASSWORD: connexpassword
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Test (runs Flyway migrations, arch tests, tenant-isolation tests)
        working-directory: backend
        run: bash gradlew test --no-daemon --stacktrace

  frontend:
    name: Frontend — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: node_modules/.bin/tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: node_modules/.bin/eslint .
