name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify CI impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      ocr: ${{ steps.classify.outputs.ocr }}
      migrations: ${{ steps.classify.outputs.migrations }}
      backup: ${{ steps.classify.outputs.backup }}
      cross_stack: ${{ steps.classify.outputs.cross_stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select the required CI surfaces
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          python3 .github/scripts/classify-ci-changes.py
          --event-name "$GITHUB_EVENT_NAME"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  ocr:
    name: OCR — contract tests
    needs: classify
    if: needs.classify.outputs.ocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install lightweight image test dependencies
        run: python -m pip install Pillow==12.3.0 numpy==2.3.5
      - name: Install pinned OCR lock compiler
        run: python -m pip install pip-tools==7.5.3
      - name: Regenerate the deployable OCR lock
        working-directory: ocr
        run: |
          pip-compile \
            --generate-hashes \
            --strip-extras \
            --allow-unsafe \
            --output-file=requirements.lock \
            requirements.txt
          git diff --exit-code -- requirements.lock
      - name: Test service protocol and benchmark manifest
        working-directory: ocr
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Build deployable OCR image
        run: docker build --tag connex-ocr-ci ocr
      - name: Smoke-test deployable OCR service
        run: bash ocr/ci/smoke_image.sh connex-ocr-ci

  migrations:
    name: Migrations — forward-only guard
    needs: classify
    if: needs.classify.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Enforce immutable, globally monotonic migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: bash .github/scripts/check-migration-immutability.sh "$BASE_SHA" HEAD
      - name: Regression-test migration guards
        run: bash .github/scripts/test-migration-immutability.sh

  backup:
    name: Backup tooling — offline regression tests
    needs: classify
    if: needs.classify.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint the backup shell tooling
        run: shellcheck -x deploy/backup/*.sh deploy/backup/tests/run-tests.sh
      - name: Selection, coverage, and retention regression tests
        run: bash deploy/backup/tests/run-tests.sh

  backend:
    name: Backend — build & test
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-root
          MYSQL_DATABASE: connexdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-${{ github.run_id }}-${{ github.run_attempt }}-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      CONNEX_DB_URL: jdbc:mysql://127.0.0.1:3306/connexdb?sslMode=DISABLED
      CONNEX_DB_USERNAME: root
      CONNEX_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 26
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Allow non-SUPER routine creation under binary logging
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pci-${{ github.run_id }}-${{ github.run_attempt }}-root -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Test (runs Flyway migrations, arch tests, tenant-isolation tests)
        working-directory: backend
        run: bash gradlew test --no-daemon --stacktrace

  frontend:
    name: Frontend — typecheck & lint
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        working-directory: frontend
        run: node_modules/.bin/tsc --noEmit
      - name: Lint changed files
        working-directory: frontend
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against — skipping changed-file lint."
            exit 0
          fi
          if ! CHANGED=$(git diff --name-only --relative --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.ts' '*.tsx'); then
            echo "git diff against base $BASE_SHA failed — failing rather than silently skipping the lint gate."
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "No changed frontend TS/TSX files — nothing to lint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$CHANGED"
          mapfile -t FILES <<< "$CHANGED"
          node_modules/.bin/eslint "${FILES[@]}"
      - name: Build deployable frontend image
        run: docker build --tag connex-frontend-ci frontend
      - name: Smoke-test standalone image optimization
        run: bash frontend/ci/smoke_image.sh connex-frontend-ci

  frontend-tests:
    # Required check on main (see #853). Keep the job name stable for branch protection.
    name: Frontend — unit & e2e
    needs: classify
    if: needs.classify.outputs.cross_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
        env:
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-e2e-root
          MYSQL_DATABASE: connex_seed_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-${{ github.run_id }}-e2e-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild sharp
      - name: Unit tests (vitest)
        working-directory: frontend
        run: node_modules/.bin/vitest run
      - name: Set up JDK 26
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Allow non-SUPER routine creation under binary logging
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pci-${{ github.run_id }}-e2e-root -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Build bootWar
        working-directory: backend
        run: bash gradlew bootWar --no-daemon -Pversion=ci
      - name: Seed deterministic fixtures into the fresh e2e schema
        working-directory: backend
        env:
          CONNEX_DB_URL: jdbc:mysql://127.0.0.1:3306/connex_seed_e2e?sslMode=DISABLED
          CONNEX_DB_USERNAME: root
          CONNEX_DB_PASSWORD: ci-${{ github.run_id }}-e2e-root
        run: |
          set -euo pipefail
          mkdir -p ../frontend/test/e2e/.artifacts
          bash gradlew seedData --no-daemon \
            -PseederProfile=small \
            -PseederSeed=853 \
            -PseederWorkspaces=1 \
            -PseederAnchorDate=2026-01-15 \
            | tee ../frontend/test/e2e/.artifacts/seeder.log
      - name: Boot backend (dev profile, fresh schema)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          CONNEX_DB_URL: jdbc:mysql://127.0.0.1:3306/connex_seed_e2e?sslMode=DISABLED
          CONNEX_DB_USERNAME: root
          CONNEX_DB_PASSWORD: ci-${{ github.run_id }}-e2e-root
        run: |
          set -euo pipefail
          WAR=$(find build/libs -name '*.war' ! -name '*-plain.war' | head -1)
          nohup java -jar "$WAR" > /tmp/e2e-backend.log 2>&1 &
          echo $! > /tmp/e2e-backend.pid
          BOOTED=0
          for _ in $(seq 1 240); do
            if curl -sf http://localhost:8080/api/version > /dev/null 2>&1; then BOOTED=1; break; fi
            if ! kill -0 "$(cat /tmp/e2e-backend.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$BOOTED" != 1 ]; then
            echo "::error::backend failed to boot for the e2e suite"
            tail -80 /tmp/e2e-backend.log
            exit 1
          fi
      - name: Build and start frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          node_modules/.bin/next build
          nohup node_modules/.bin/next start > /tmp/e2e-frontend.log 2>&1 &
          echo $! > /tmp/e2e-frontend.pid
          READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3000/auth/login > /dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$(cat /tmp/e2e-frontend.pid)" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            echo "::error::frontend failed to start for the e2e suite"
            tail -40 /tmp/e2e-frontend.log
            exit 1
          fi
      - name: Install Playwright Chromium
        working-directory: frontend
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        working-directory: frontend
        run: node_modules/.bin/playwright test
      - name: Surface server logs on failure
        if: failure()
        run: |
          echo "=== backend (tail) ==="; tail -100 /tmp/e2e-backend.log 2>/dev/null || true
          echo "=== frontend (tail) ==="; tail -60 /tmp/e2e-frontend.log 2>/dev/null || true
      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/test/e2e/.artifacts/seeder.log
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: CI — required
    if: always()
    needs: [classify, ocr, migrations, backup, backend, frontend, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected CI job to succeed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          OCR_RESULT: ${{ needs.ocr.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_TESTS_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          set -euo pipefail
          for result in \
            "$CLASSIFY_RESULT" \
            "$OCR_RESULT" \
            "$MIGRATIONS_RESULT" \
            "$BACKUP_RESULT" \
            "$BACKEND_RESULT" \
            "$FRONTEND_RESULT" \
            "$FRONTEND_TESTS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::required CI dependency concluded: $result"; exit 1 ;;
            esac
          done
