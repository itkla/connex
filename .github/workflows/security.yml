name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action-pins:
    name: Workflow action pin policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned structural YAML parser
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --require-hashes
          --requirement .github/scripts/action-pin-requirements.lock
      - name: Require immutable external action revisions
        run: python .github/scripts/check-action-pins.py
      - name: Regression-test action pin policy
        run: python .github/scripts/test_action_pins.py
      - name: Regression-test release delivery invariants
        run: python .github/scripts/test_release_workflow.py
      - name: Regression-test release artifact verification
        run: python .github/scripts/test_attested_sbom.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="$BASE_SHA..$HEAD_SHA"
          else
            LOG_OPTS="-1"
          fi
          git log --format= --no-ext-diff --unified=0 --patch "$LOG_OPTS" \
            | awk '/^\+\+\+ / { next } /^\+/ { print substr($0, 2) }' \
            | docker run --rm -i \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            stdin --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit (fail on high+)
        working-directory: frontend
        run: pnpm audit --audit-level=high

  ocr-audit:
    name: OCR dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned auditor
        run: python -m pip install --require-hashes --requirement ocr/audit-requirements.lock
      - name: Audit pinned runtime requirements
        run: |
          python -m pip_audit --requirement ocr/audit-requirements.lock --disable-pip
          python -m pip_audit --requirement ocr/requirements.lock --disable-pip

  dependency-review:
    name: Dependency review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high

  gradle-dependency-graph:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          build-root-directory: backend
