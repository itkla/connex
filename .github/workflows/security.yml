name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 0'

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify security impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action_pins: ${{ steps.classify.outputs.action_pins }}
      frontend_audit: ${{ steps.classify.outputs.frontend_audit }}
      ocr_audit: ${{ steps.classify.outputs.ocr_audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select the required security surfaces
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: >-
          python3 .github/scripts/classify-ci-changes.py
          --event-name "$GITHUB_EVENT_NAME"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  action-pins:
    name: Workflow action pin policy
    needs: classify
    if: needs.classify.outputs.action_pins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned structural YAML parser
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --require-hashes
          --requirement .github/scripts/action-pin-requirements.lock
      - name: Require immutable external action revisions
        run: python .github/scripts/check-action-pins.py
      - name: Regression-test action pin policy
        run: python .github/scripts/test_action_pins.py
      - name: Regression-test CI change classification
        run: python .github/scripts/test_ci_change_classification.py
      - name: Regression-test release delivery invariants
        run: python .github/scripts/test_release_workflow.py
      - name: Regression-test release artifact verification
        run: python .github/scripts/test_attested_sbom.py

  secret-scan:
    name: Secret scan (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="$BASE_SHA..$HEAD_SHA"
          else
            LOG_OPTS="-1"
          fi
          git log --format= --no-ext-diff --unified=0 --patch "$LOG_OPTS" \
            | awk '/^\+\+\+ / { next } /^\+/ { print substr($0, 2) }' \
            | docker run --rm -i \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            stdin --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  frontend-audit:
    name: Frontend dependency audit
    needs: classify
    if: needs.classify.outputs.frontend_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit (fail on high+)
        working-directory: frontend
        run: pnpm audit --audit-level=high

  ocr-audit:
    name: OCR dependency audit
    needs: classify
    if: needs.classify.outputs.ocr_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned auditor
        run: python -m pip install --require-hashes --requirement ocr/audit-requirements.lock
      - name: Audit pinned runtime requirements
        run: |
          python -m pip_audit --requirement ocr/audit-requirements.lock --disable-pip
          python -m pip_audit --requirement ocr/requirements.lock --disable-pip

  dependency-review:
    name: Dependency review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  gradle-dependency-graph:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          build-root-directory: backend

  required:
    name: Security — required
    if: always()
    needs:
      - classify
      - action-pins
      - secret-scan
      - frontend-audit
      - ocr-audit
      - dependency-review
      - gradle-dependency-graph
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected security job to succeed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ACTION_PINS_RESULT: ${{ needs.action-pins.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          FRONTEND_AUDIT_RESULT: ${{ needs.frontend-audit.result }}
          OCR_AUDIT_RESULT: ${{ needs.ocr-audit.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          GRADLE_GRAPH_RESULT: ${{ needs.gradle-dependency-graph.result }}
        run: |
          set -euo pipefail
          for result in \
            "$CLASSIFY_RESULT" \
            "$ACTION_PINS_RESULT" \
            "$SECRET_SCAN_RESULT" \
            "$FRONTEND_AUDIT_RESULT" \
            "$OCR_AUDIT_RESULT" \
            "$DEPENDENCY_REVIEW_RESULT" \
            "$GRADLE_GRAPH_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::required security dependency concluded: $result"; exit 1 ;;
            esac
          done
