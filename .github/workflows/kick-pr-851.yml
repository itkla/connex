name: Kick PR 851 resolution

on:
  push:
    branches:
      - docs/agent-resource-discipline
    paths:
      - .github/workflows/kick-pr-851.yml

permissions:
  contents: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: docs/agent-resource-discipline
      - name: Execute reviewed resolution script
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/        run: |/,$p' .github/workflows/resolve-pr-851.yml \
            | tail -n +2 \
            | sed 's/^          //' > /tmp/resolve-pr-851.sh
          sed -i 's#rm .github/workflows/resolve-pr-851.yml#rm .github/workflows/resolve-pr-851.yml .github/workflows/kick-pr-851.yml#' /tmp/resolve-pr-851.sh
          sed -i 's#.github/workflows/resolve-pr-851.yml#.github/workflows/resolve-pr-851.yml .github/workflows/kick-pr-851.yml#2' /tmp/resolve-pr-851.sh
          bash /tmp/resolve-pr-851.sh
