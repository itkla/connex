# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

on:
  # Advisory frontend analysis only runs when frontend code or this workflow changes.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2
        with:
          version: "0.8.3"
          directory: frontend
        # Advisory by default: React Doctor reports findings on frontend PRs —
        # a sticky summary comment, inline review comments, and a commit status
        # with the health score — but never fails the check. When the signal is
        # trusted, set blocking to "error" or "warning" deliberately.
