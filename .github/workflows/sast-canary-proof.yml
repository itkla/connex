name: SAST canary proof

# Proves the CodeQL merge gate still blocks a real vulnerability, on the real workflow.
#
# `canary/sast-gate-proof` is a permanent, never-merged pull request carrying one deliberately
# vulnerable fixture per analysed language. This workflow re-runs that pull request's own Security
# run and asserts the whole chain: CodeQL reported both fixtures, GitHub attributed them to the pull
# request (which only holds while result paths are repository-relative), each analysis stored the
# base commit's result count plus exactly one (which only holds while nothing prunes pull-request
# results), both SAST jobs failed at the gate step rather than at the tooling, `Security — required`
# failed, branch protection still requires the three contexts, and the pull request is BLOCKED.
#
# A failed gate step and a fixture alert on the merge ref do not by themselves prove a fresh
# rejection: a failed gh api fetch fails the step like a blocking verdict does, and alerts and
# analyses of earlier attempts persist on the reused merge commit. The proof therefore binds the run
# to the canary's head before re-running it, pins every piece of evidence to the new attempt, and
# requires each job's own 'Blocking CodeQL alert #N' annotation and analyses created inside that
# attempt's SAST jobs (#1603).
#
# A re-run reuses the original merge commit, so the canary ages: GitHub refuses to re-run a workflow
# run more than 30 days after its initial run, and the base commit's analyses drift down main's
# analysis list. The proof therefore refuses a canary run older than MAX_RUN_AGE_DAYS and walks at
# most MAIN_ANALYSES_PAGE_BUDGET pages of main's analyses, and fails each case with the same remedy:
# rebase canary/sast-gate-proof onto main and force-push.
#
# There is no push trigger on purpose: `test_main_red_alert.py` requires every workflow that runs on
# a push to main to be watched by the red-main alert, and a proof failure has its own issue.

on:
  schedule:
    # After the Security workflow's Sunday 19:23 UTC scan, so main's analyses are fresh.
    - cron: '37 21 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-canary-proof
  cancel-in-progress: false

jobs:
  prove:
    name: Prove the CodeQL gate blocks the canary
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
      security-events: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CANARY_BRANCH: canary/sast-gate-proof
      CANARY_LABEL: sast-canary
      BACKEND_CATEGORY: /language:java-kotlin
      FRONTEND_CATEGORY: /language:javascript-typescript
      BACKEND_FIXTURE: backend/src/test/java/ooo/klae/connex/backend/codeqlfixture/IntentionalCommandInjectionFixture.java
      FRONTEND_FIXTURE: frontend/test/fixtures/codeql/intentional-command-injection.mjs
      MAX_RUN_AGE_DAYS: '28'
      MAIN_ANALYSES_PAGE_BUDGET: '20'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Discover the canary pull request
        id: canary
        run: |
          set -euo pipefail
          pulls="$(gh pr list --repo "$REPO" --head "$CANARY_BRANCH" --base main \
            --state open --label "$CANARY_LABEL" --json number,isDraft)"
          count="$(printf '%s' "$pulls" | jq 'length')"
          if [ "$count" != "1" ]; then
            echo "::error::expected exactly one open $CANARY_LABEL pull request from $CANARY_BRANCH, found $count"
            exit 1
          fi
          number="$(printf '%s' "$pulls" | jq -r '.[0].number')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Canary pull request #$number"
      - name: Assert the canary carries the current gate
        id: freshness
        env:
          CANARY_NUMBER: ${{ steps.canary.outputs.number }}
        run: |
          set -euo pipefail
          analyses="$(gh api "repos/$REPO/code-scanning/analyses?ref=refs/pull/$CANARY_NUMBER/merge&per_page=20")"
          merge_shas="$(printf '%s' "$analyses" \
            | jq -r --arg backend "$BACKEND_CATEGORY" --arg frontend "$FRONTEND_CATEGORY" \
              '[.[] | select(.category == $backend or .category == $frontend)]
               | group_by(.category) | map(sort_by(.created_at) | last | .commit_sha) | unique | .[]')"
          if [ "$(printf '%s\n' "$merge_shas" | grep -c .)" != "1" ]; then
            echo "::error::the canary's two CodeQL categories were analysed at different commits: $merge_shas"
            exit 1
          fi
          merge_sha="$merge_shas"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          # A re-run reuses the original merge commit, so a gate change on main is not exercised
          # until someone rebases the canary. Compare each gate file's blob id instead of trusting
          # the branch date.
          stale=0
          for file in .github/workflows/security.yml .github/scripts/check-codeql-alerts.py \
                      .github/scripts/classify-ci-changes.py .github/codeql/backend.yml \
                      .github/codeql/frontend.yml; do
            on_main="$(gh api "repos/$REPO/contents/$file?ref=main" --jq '.sha')"
            on_canary="$(gh api "repos/$REPO/contents/$file?ref=$merge_sha" --jq '.sha' 2>/dev/null || echo missing)"
            if [ "$on_main" != "$on_canary" ]; then
              echo "::error::canary is stale at $file ($on_main on main, $on_canary on the canary): rebase canary/sast-gate-proof onto main and force-push"
              stale=1
            fi
          done
          # The fixtures must never be reachable from the default branch. Only an explicit 404
          # proves absence: a rate limit, a 5xx or a token-scope failure is reported as such rather
          # than read as "absent".
          for fixture in "$BACKEND_FIXTURE" "$FRONTEND_FIXTURE"; do
            if probe="$(gh api "repos/$REPO/contents/$fixture?ref=main" 2>&1)"; then
              echo "::error::$fixture exists on main; the canary fixtures must never be merged"
              stale=1
            elif ! printf '%s' "$probe" | grep -q 'HTTP 404'; then
              echo "::error::could not prove $fixture is absent from main: $probe"
              stale=1
            fi
          done
          exit "$stale"
      - name: Re-run the canary's Security workflow
        # A step-level bound (below the job's 75 minutes) turns a slow or queued re-run into a
        # failed step, so the reporting step below still runs; a job-level timeout would cancel the
        # whole job before it could report.
        timeout-minutes: 55
        id: rerun
        env:
          CANARY_NUMBER: ${{ steps.canary.outputs.number }}
        run: |
          set -euo pipefail
          # Bind the run to the canary's current head before re-running it: the newest run on the
          # branch can be a push run, a run of an older head, or one whose pull request changed,
          # and its evidence would then prove nothing about the canary.
          head_sha="$(gh pr view "$CANARY_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          if [ -z "$head_sha" ]; then
            echo "::error::could not read the head commit of pull request #$CANARY_NUMBER"
            exit 1
          fi
          run_id="$(gh api \
            "repos/$REPO/actions/workflows/security.yml/runs?event=pull_request&branch=$CANARY_BRANCH&head_sha=$head_sha&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::no Security run found for $CANARY_BRANCH at $head_sha; push the canary branch first"
            exit 1
          fi
          run="$(gh api "repos/$REPO/actions/runs/$run_id")"
          binding="$(printf '%s' "$run" | jq -r \
            --arg branch "$CANARY_BRANCH" --arg head "$head_sha" --argjson number "$CANARY_NUMBER" \
            '[(.event == "pull_request"), (.head_branch == $branch), (.head_sha == $head),
              any(.pull_requests[]?; .number == $number)] | map(tostring) | join(" ")')"
          if [ "$binding" != "true true true true" ]; then
            echo "::error::Security run $run_id is not the canary's pull_request run at $head_sha (event, branch, head, pull request: $binding)"
            exit 1
          fi
          # A re-run keeps the run id and bumps run_attempt. Record the attempt first: for the
          # first seconds after the POST the run is still reported as the previous, completed
          # attempt, and a poll that only reads `status` would accept that stale verdict.
          attempt_before="$(printf '%s' "$run" | jq -r '.run_attempt')"
          created_at="$(printf '%s' "$run" | jq -r '.created_at')"
          case "$attempt_before" in
            ''|*[!0-9]*) echo "::error::Security run $run_id reported no run attempt"; exit 1 ;;
          esac
          # GitHub refuses to re-run a run more than 30 days after its initial run, and the base
          # commit of an old merge commit falls out of the analyses the proof fetches. Refuse the
          # aged run here, with the remedy, instead of surfacing a raw API error from the POST.
          age_days="$(( ( $(date -u +%s) - $(date -u -d "$created_at" +%s) ) / 86400 ))"
          if [ "$age_days" -gt "$MAX_RUN_AGE_DAYS" ]; then
            echo "::error::the canary's Security run $run_id was created $age_days days ago (limit $MAX_RUN_AGE_DAYS days): rebase canary/sast-gate-proof onto main and force-push so a fresh run exists"
            exit 1
          fi
          # Evidence older than this instant belongs to an earlier attempt of the same merge commit.
          rerun_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          attempt="$((attempt_before + 1))"
          gh api --method POST "repos/$REPO/actions/runs/$run_id/rerun" >/dev/null
          {
            echo "run_id=$run_id"
            echo "attempt=$attempt"
            echo "head_sha=$head_sha"
            echo "rerun_started_at=$rerun_started_at"
          } >> "$GITHUB_OUTPUT"
          echo "Re-running Security run $run_id (attempt $attempt_before) for pull request #$CANARY_NUMBER at $head_sha"
          for _ in $(seq 1 45); do
            sleep 60
            state="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status + ":" + (.run_attempt|tostring)')"
            echo "run $run_id is $state"
            if [ "$state" = "completed:$attempt" ]; then
              exit 0
            fi
          done
          echo "::error::Security run $run_id did not complete within 45 minutes"
          exit 1
      - name: Collect evidence
        id: evidence
        env:
          CANARY_NUMBER: ${{ steps.canary.outputs.number }}
          FRESHNESS_MERGE_SHA: ${{ steps.freshness.outputs.merge_sha }}
          RUN_ID: ${{ steps.rerun.outputs.run_id }}
          ATTEMPT: ${{ steps.rerun.outputs.attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary"
          # Pin every piece of run evidence to the re-run attempt: the run-level jobs list and a
          # later re-run by anyone else would otherwise substitute another attempt's verdict.
          gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT" > "$RUNNER_TEMP/canary/run.json"
          gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/canary/jobs.json"
          # A failed gate step does not say why it failed. The gate's own annotations do: only a
          # blocking verdict writes 'Blocking CodeQL alert #N'. A job id is its check-run id.
          collect_annotations() {
            local job_name="$1" output="$2" job_ids
            job_ids="$(jq -c --arg name "$job_name" '[.jobs[] | select(.name == $name) | .id]' \
              "$RUNNER_TEMP/canary/jobs.json")"
            if [ "$(printf '%s' "$job_ids" | jq 'length')" != "1" ]; then
              echo "::error::expected exactly one '$job_name' job in attempt $ATTEMPT, found $job_ids"
              exit 1
            fi
            gh api "repos/$REPO/check-runs/$(printf '%s' "$job_ids" | jq -r '.[0]')/annotations?per_page=100" \
              > "$output"
          }
          collect_annotations 'Backend SAST (CodeQL)' "$RUNNER_TEMP/canary/annotations-backend.json"
          collect_annotations 'Frontend SAST (CodeQL)' "$RUNNER_TEMP/canary/annotations-frontend.json"
          gh api --method GET --paginate --slurp \
            -f tool_name=CodeQL -f state=open -f per_page=100 \
            -f "ref=refs/pull/$CANARY_NUMBER/merge" \
            "repos/$REPO/code-scanning/alerts" > "$RUNNER_TEMP/canary/ref-alerts.json"
          gh api --method GET --paginate --slurp \
            -f tool_name=CodeQL -f state=open -f per_page=100 \
            -f "pr=$CANARY_NUMBER" \
            "repos/$REPO/code-scanning/alerts" > "$RUNNER_TEMP/canary/pr-alerts.json"
          gh api "repos/$REPO/code-scanning/analyses?ref=refs/pull/$CANARY_NUMBER/merge&per_page=20" \
            > "$RUNNER_TEMP/canary/ref-analyses.json"
          # Re-derive the analysed merge commit from the re-run's analyses rather than trusting the
          # pre-rerun one; the staleness check above only covers the commit it inspected.
          merge_shas="$(jq -r --arg backend "$BACKEND_CATEGORY" --arg frontend "$FRONTEND_CATEGORY" \
            '[.[] | select(.category == $backend or .category == $frontend)]
             | group_by(.category) | map(sort_by(.created_at) | last | .commit_sha) | unique | .[]' \
            "$RUNNER_TEMP/canary/ref-analyses.json")"
          if [ "$merge_shas" != "$FRESHNESS_MERGE_SHA" ]; then
            echo "::error::the re-run analysed $merge_shas, not the merge commit $FRESHNESS_MERGE_SHA whose gate files were checked"
            exit 1
          fi
          gh api "repos/$REPO/commits/$FRESHNESS_MERGE_SHA" > "$RUNNER_TEMP/canary/merge-commit.json"
          # The count invariant needs main's analyses of the merge commit's first parent. One page
          # of 100 covers about a week of main at the 2026-09 merge rate, so walk newest-first until
          # both categories of that commit are found, the list ends, or the page budget runs out.
          # The verifier names the rebase remedy when the base commit is not in what was fetched.
          base_sha="$(jq -r '.parents[0].sha' "$RUNNER_TEMP/canary/merge-commit.json")"
          page_files=()
          for page in $(seq 1 "$MAIN_ANALYSES_PAGE_BUDGET"); do
            page_file="$RUNNER_TEMP/canary/main-analyses-page-$page.json"
            gh api "repos/$REPO/code-scanning/analyses?ref=refs/heads/main&per_page=100&page=$page" \
              > "$page_file"
            page_files+=("$page_file")
            jq -s 'add' "${page_files[@]}" > "$RUNNER_TEMP/canary/main-analyses.json"
            found="$(jq --arg sha "$base_sha" --arg backend "$BACKEND_CATEGORY" --arg frontend "$FRONTEND_CATEGORY" \
              '[.[] | select(.commit_sha == $sha) | .category | select(. == $backend or . == $frontend)]
               | unique | length' "$RUNNER_TEMP/canary/main-analyses.json")"
            echo "main analyses page $page: $found of 2 categories analysed at base commit ${base_sha:0:9}"
            if [ "$found" = "2" ] || [ "$(jq 'length' "$page_file")" -lt 100 ]; then
              break
            fi
          done
          gh api "repos/$REPO/branches/main" > "$RUNNER_TEMP/canary/branch.json"
          gh api graphql -f query='
            query($owner:String!,$name:String!,$number:Int!){
              repository(owner:$owner,name:$name){
                pullRequest(number:$number){
                  number
                  isDraft
                  mergeStateStatus
                  commits(last:1){nodes{commit{
                    oid
                    statusCheckRollup{contexts(first:100){nodes{
                      __typename
                      ... on CheckRun{name conclusion}
                    }}}
                  }}}
                }
              }
            }' \
            -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$CANARY_NUMBER" \
            --jq '.data.repository.pullRequest' > "$RUNNER_TEMP/canary/pull-request.json"
      - name: Verify the proof
        env:
          CANARY_NUMBER: ${{ steps.canary.outputs.number }}
          RUN_ID: ${{ steps.rerun.outputs.run_id }}
          ATTEMPT: ${{ steps.rerun.outputs.attempt }}
          HEAD_SHA: ${{ steps.rerun.outputs.head_sha }}
          RERUN_STARTED_AT: ${{ steps.rerun.outputs.rerun_started_at }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-sast-canary.py \
            --run "$RUNNER_TEMP/canary/run.json" \
            --run-id "$RUN_ID" \
            --attempt "$ATTEMPT" \
            --rerun-started-at "$RERUN_STARTED_AT" \
            --expected-head-sha "$HEAD_SHA" \
            --jobs "$RUNNER_TEMP/canary/jobs.json" \
            --backend-annotations "$RUNNER_TEMP/canary/annotations-backend.json" \
            --frontend-annotations "$RUNNER_TEMP/canary/annotations-frontend.json" \
            --ref-alerts "$RUNNER_TEMP/canary/ref-alerts.json" \
            --pr-alerts "$RUNNER_TEMP/canary/pr-alerts.json" \
            --ref-analyses "$RUNNER_TEMP/canary/ref-analyses.json" \
            --main-analyses "$RUNNER_TEMP/canary/main-analyses.json" \
            --merge-commit "$RUNNER_TEMP/canary/merge-commit.json" \
            --branch "$RUNNER_TEMP/canary/branch.json" \
            --pull-request "$RUNNER_TEMP/canary/pull-request.json" \
            --canary-number "$CANARY_NUMBER" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --require-admin-enforcement
      - name: Report a failed proof
        # The re-run step's own timeout-minutes turns a slow re-run into failure() before the
        # job-level bound (75 minutes) could cancel the job; cancelled() covers a manual
        # cancellation. A workflow-file error concludes startup_failure without running any step
        # and is visible only in the Actions tab.
        if: failure() || cancelled()
        env:
          CANARY_NUMBER: ${{ steps.canary.outputs.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='SAST gate canary proof failed'
          body="$(printf '%s\n' \
            "The weekly CodeQL gate canary proof did not pass for pull request #$CANARY_NUMBER (job status: $JOB_STATUS)." \
            "" \
            "$RUN_URL" \
            "" \
            "Read the failed step's annotations and the run's step summary: they name the exact" \
            "assertion that did not hold. Until it is resolved, the merge gate is unproven." \
            "" \
            "Close this issue once the proof is green again.")"
          gh label create "$CANARY_LABEL-failed" --repo "$REPO" --color B60205 \
            --description "The SAST gate canary proof failed" 2>/dev/null || true
          existing="$(gh issue list --repo "$REPO" --state open --label "$CANARY_LABEL-failed" \
            --limit 100 --json number --jq 'sort_by(.number) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" \
              --label "$CANARY_LABEL-failed" --body "$body"
          fi
