# No query filters.
#
# `java/potentially-weak-cryptographic-algorithm` was excluded here for the SHA-1 that HIBP's
# k-anonymity Range API mandates (#1295). A query filter is repository-wide, so that annotation
# described one accepted use while silencing the query for every other MD5 or SHA-1 in the backend --
# in token handling, signatures or authentication -- where it would be a real finding.
#
# The exclusion is replaced by dismissing that single alert, which is scoped to the one location and
# carries the same accountability metadata. Keep this list empty: an entry here is never narrower
# than the whole repository. See #1464.

query-filters: []
