##
## Connex ClamAV sidecar — BUILD-TIME ONLY freshclam configuration.
##
## This file is used by `python -m clamav_service.prefetch` during the image build to bake a
## signature set into the image. No freshclam process runs at container runtime: the scanning
## network is `internal: true` and has no route off the host. See clamav/AGENTS.md and
## docs/MALWARE_SCANNING.md for how an operator updates signatures after deployment.

DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
DatabaseOwner root
# The build must fail loudly rather than produce an image with a partial signature set.
Foreground yes
LogVerbose no
LogTime yes
LogSyslog no
UpdateLogFile /dev/stdout
# One attempt per invocation; prefetch.py owns the retry policy and its bound.
MaxAttempts 1
ConnectTimeout 60
ReceiveTimeout 0
# Bytecode signatures ship in bytecode.cvd and are required: clamd.conf sets Bytecode yes.
Bytecode yes
ScriptedUpdates no
# No notification callbacks, no third-party mirrors, no arbitrary post-update commands.
NotifyClamd no
