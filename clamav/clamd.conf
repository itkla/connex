##
## Connex ClamAV sidecar — clamd configuration.
##
## Every limit below is set EXPLICITLY. Do not delete a directive on the grounds that it
## "matches the default": the upstream defaults for several of these are actively unsafe for
## this use case, and a future clamd release may change any of them. The values here are
## reconciled with the backend's 25 MiB upload content ceiling
## (connex.object-storage.max-upload-bytes) and with UploadContentInspector's own 64 MiB ZIP
## expansion bound.

# clamd is supervised by clamav_service.supervisor, which needs it in the foreground.
Foreground yes

# No LogFile. clamd runs in the foreground under the supervisor, so diagnostics land on the
# container's stdout/stderr where `docker logs` finds them. A log file would need a writable
# path carved out of the read-only rootfs and would be one more thing to size.
LogTime yes
LogClean no
LogVerbose no
# Never write filenames or signature names into a syslog the operator did not ask for.
LogSyslog no

DatabaseDirectory /var/lib/clamav

# NO TCP SOCKET. clamd's own SCAN/MULTISCAN/ALLMATCHSCAN commands take filesystem PATHS, so a
# reachable clamd port is an arbitrary-file-read primitive against the sidecar's filesystem and
# an alternate, unauthenticated scanning surface that bypasses the HTTP front's bearer auth,
# size ceiling and deadline. The unix socket lives inside the container's private tmpfs and is
# reachable only by the clamav_service process running as the same uid.
#
# TCPSocket is INTENTIONALLY ABSENT rather than set: clamd's default is "no", and a bare
# directive with no argument is a parse error. If you ever add a TCPSocket line here, you have
# reopened that surface -- do not.
LocalSocket /tmp/clamav-run/clamd.sock
LocalSocketMode 600

# INSTREAM spools the submitted bytes to a temporary file before scanning, and archive members
# are unpacked to temp files as well. The container rootfs is read-only, so this MUST point at
# the writable tmpfs. Sizing is asserted at startup by clamav_service.config against
# CONNEX_CLAMAV_MAX_CONCURRENT_SCANS x (StreamMaxLength + MaxScanSize).
TemporaryDirectory /tmp/clamav-scan
LeaveTemporaryFiles no

# One clamd worker thread per permitted concurrent scan, plus headroom for PING/VERSION probes.
MaxThreads 8
MaxQueue 16
# clamd's own read deadline, kept below the sidecar's absolute request deadline.
ReadTimeout 60
CommandReadTimeout 15
IdleTimeout 30
ExitOnOOM yes

# Reloading a database concurrently holds TWO full copies of the signature set resident, which
# roughly doubles peak RSS and is the most likely way to get this container OOM-killed inside
# its memory limit. An OOM-killed scanner is an outage; a briefly-blocking reload is not.
ConcurrentDatabaseReload no

##
## Scan limits.
##
## The backend refuses any upload body above 25 MiB (26214400) before it ever reaches here, and
## the sidecar refuses anything above CONNEX_CLAMAV_MAX_SCAN_BYTES at the HTTP boundary. These
## values sit above that ceiling with headroom so that a legitimate 25 MiB upload is scanned in
## full rather than silently truncated.

# 32 MiB. Exceeding this makes clamd answer "INSTREAM size limit exceeded" and close the
# connection; the sidecar maps that to "unscannable", which the backend turns into a rejection.
# It is never treated as clean.
StreamMaxLength 32M
MaxFileSize 32M

# 192 MiB of total extracted data per input file, comfortably above UploadContentInspector's
# 64 MiB ZIP expansion bound. Upstream default is 400M, which would let a single scan fill the
# scan tmpfs.
MaxScanSize 192M
MaxFiles 4096
MaxRecursion 10
MaxEmbeddedPE 16M
MaxHTMLNormalize 16M
MaxHTMLNoTags 8M
MaxScriptNormalize 8M
MaxZipTypeRcg 4M
MaxPartitions 64
MaxIconsPE 128
MaxRecHWP3 8
PCREMatchLimit 10000
PCRERecMatchLimit 5000
PCREMaxFileSize 32M
# 30 s, deliberately below the sidecar's absolute scan deadline so clamd gives up first and
# returns an error we can classify, instead of the sidecar timing out on a live connection.
MaxScanTime 30000

##
## THE most important directive in this file.
##
## Upstream default is "no", and with "no" clamd STOPS SCANNING and returns a CLEAN verdict when
## it hits MaxFileSize, MaxScanSize, MaxFiles or MaxRecursion. That would make this whole control
## decorative: a file crafted to exceed a limit would be admitted as clean. With "yes", a limit
## hit becomes a "Heuristics.Limits.Exceeded.*" detection, which the sidecar reports as
## "unscannable" and the backend rejects. Removing this line silently disables the control.
AlertExceedsMax yes

# An encrypted container cannot be inspected, so admitting one is a trivial bypass. These are
# reported as "Heuristics.Encrypted.*" and classified as "unscannable", not as malware: the
# user gets "this could not be scanned", not a false accusation.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes

# Deliberately LEFT OFF (upstream default "no"). Turning this on reports every macro-bearing
# Office document as "Heuristics.OLE2.ContainsMacros.*", i.e. blanket-rejects macro-bearing
# XLSX/DOC, which Japanese enterprise customers exchange routinely. The decision (issue #1240)
# is to scan macros for KNOWN MALWARE and not to reject documents merely for having macros.
# Largely moot today because UploadPolicy's allowlist already excludes macro-enabled OOXML --
# it becomes live only if that allowlist widens, which is why the reasoning is recorded here.
# If you do enable it, note the sidecar classifies the resulting detection as "unscannable"
# rather than "infected", so users are not told their spreadsheet is a virus.
AlertOLE2Macros no

AlertBrokenExecutables yes
AlertBrokenMedia yes
AlertPartitionIntersection yes

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
ScanMail yes
ScanHTML yes

# Off: these are DLP heuristics that flag credit-card and SSN patterns inside ordinary business
# documents. This is a CRM. Enabling them would quarantine legitimate invoices as "malware".
StructuredDataDetection no

# Execute only the bytecode signatures that ship inside the digitally signed bytecode.cvd.
Bytecode yes
BytecodeSecurity TrustSigned

# On-access scanning is deliberately absent: it needs the separate clamonacc binary, which this
# image does not install, and fanotify capabilities this container has dropped.
