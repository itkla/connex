# Labels are deliberately reduced before routing: no URI, actor, name, email or exception.
groups:
  - name: connex-security
    interval: 15s
    rules:
      - alert: ConnexAuthenticationFailureTenantSpike
        expr: sum by (scope) ((connex_security_authentication_failures_total{job="connex",scope!="unattributed"} unless connex_security_authentication_failures_total{job="connex",scope!="unattributed"} offset 5m) or increase(connex_security_authentication_failures_total{job="connex",scope!="unattributed"}[5m])) >= 20
        labels:
          severity: warning
        annotations:
          summary: At least 20 audited authentication failures in one tenant in 5 minutes
      - alert: ConnexAuthenticationFailureGlobalSpike
        expr: sum((connex_security_authentication_failures_total{job="connex"} unless connex_security_authentication_failures_total{job="connex"} offset 5m) or increase(connex_security_authentication_failures_total{job="connex"}[5m])) >= 100
        labels:
          severity: critical
        annotations:
          summary: At least 100 audited authentication failures globally in 5 minutes
      - alert: ConnexPermissionChange
        expr: time() - max by (scope) (connex_security_permission_change_timestamp{job="connex"}) < 900
        labels:
          severity: warning
        annotations:
          summary: A role definition or membership privilege changed within 15 minutes
      - alert: ConnexServerErrorRateSpike
        expr: (sum(rate(http_server_requests_seconds_count{job="connex",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="connex"}[5m])) > 0.05) and sum(increase(http_server_requests_seconds_count{job="connex"}[5m])) >= 100
        labels:
          severity: critical
        annotations:
          summary: More than 5 percent HTTP 5xx responses with at least 100 requests in 5 minutes
      - alert: ConnexBackupFailure
        expr: max(connex_backup_failed{job="connex-backup"}) > 0
        labels:
          severity: critical
        annotations:
          summary: A backup job failed and requires operator acknowledgement
      - alert: ConnexAuditIntegrityAnomaly
        expr: max by (scope) (connex_security_audit_integrity_anomaly_timestamp{job="connex"}) > 0
        labels:
          severity: critical
        annotations:
          summary: A read audit row has an invalid or unverifiable HMAC
      - alert: ConnexMetricsUnavailable
        expr: absent(up{job="connex"}) or min(up{job="connex"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Connex security metrics are unavailable
