# Below-threshold, threshold, and nonzero-first-scrape regression cases.
rule_files: [security-rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: "up{job=\"connex\"}"
        values: "1+0x10"
      - series: "connex_security_authentication_failures_total{job=\"connex\",scope=\"workspace:7\"}"
        values: "0+4x5"
      - series: "connex_security_authentication_failures_total{job=\"connex\",scope=\"unattributed\"}"
        values: "0+16x5"
      - series: "http_server_requests_seconds_count{job=\"connex\",status=\"200\",uri=\"sensitive\"}"
        values: "0+36x5"
      - series: "http_server_requests_seconds_count{job=\"connex\",status=\"500\",uri=\"sensitive\"}"
        values: "0+4x5"
      - series: "connex_backup_failed{job=\"connex-backup\"}"
        values: "1+0x5"
      - series: "connex_security_permission_change_timestamp{job=\"connex\",scope=\"workspace:7\"}"
        values: "1+0x5"
      - series: "connex_security_audit_integrity_anomaly_timestamp{job=\"connex\",scope=\"workspace:7\"}"
        values: "1+0x5"
    alert_rule_test:
      - eval_time: 5m
        alertname: ConnexAuthenticationFailureTenantSpike
        exp_alerts:
          - exp_labels: {"severity": "warning", "scope": "workspace:7"}
            exp_annotations: {"summary": "At least 20 audited authentication failures in one tenant in 5 minutes"}
      - eval_time: 5m
        alertname: ConnexAuthenticationFailureGlobalSpike
        exp_alerts:
          - exp_labels: {"severity": "critical"}
            exp_annotations: {"summary": "At least 100 audited authentication failures globally in 5 minutes"}
      - eval_time: 5m
        alertname: ConnexPermissionChange
        exp_alerts:
          - exp_labels: {"severity": "warning", "scope": "workspace:7"}
            exp_annotations: {"summary": "A role definition or membership privilege changed within 15 minutes"}
      - eval_time: 5m
        alertname: ConnexServerErrorRateSpike
        exp_alerts:
          - exp_labels: {"severity": "critical"}
            exp_annotations: {"summary": "More than 5 percent HTTP 5xx responses with at least 100 requests in 5 minutes"}
      - eval_time: 5m
        alertname: ConnexBackupFailure
        exp_alerts:
          - exp_labels: {"severity": "critical"}
            exp_annotations: {"summary": "A backup job failed and requires operator acknowledgement"}
      - eval_time: 5m
        alertname: ConnexAuditIntegrityAnomaly
        exp_alerts:
          - exp_labels: {"severity": "critical", "scope": "workspace:7"}
            exp_annotations: {"summary": "A read audit row has an invalid or unverifiable HMAC"}
      - eval_time: 5m
        alertname: ConnexMetricsUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: "up{job=\"connex\"}"
        values: "1+0x10"
      - series: "connex_security_authentication_failures_total{job=\"connex\",scope=\"workspace:7\"}"
        values: "19+0x4"
      - series: "connex_security_authentication_failures_total{job=\"connex\",scope=\"unattributed\"}"
        values: "80+0x4"
      - series: "http_server_requests_seconds_count{job=\"connex\",status=\"200\",uri=\"sensitive\"}"
        values: "0+38x4"
      - series: "http_server_requests_seconds_count{job=\"connex\",status=\"500\",uri=\"sensitive\"}"
        values: "0+2x4"
      - series: "connex_backup_failed{job=\"connex-backup\"}"
        values: "0+0x5"
      - series: "connex_security_permission_change_timestamp{job=\"connex\",scope=\"workspace:7\"}"
        values: "_ _ _ _ _ _"
      - series: "connex_security_audit_integrity_anomaly_timestamp{job=\"connex\",scope=\"workspace:7\"}"
        values: "_ _ _ _ _ _"
    alert_rule_test:
      - eval_time: 4m
        alertname: ConnexAuthenticationFailureTenantSpike
        exp_alerts: []
      - eval_time: 4m
        alertname: ConnexAuthenticationFailureGlobalSpike
        exp_alerts: []
      - eval_time: 4m
        alertname: ConnexPermissionChange
        exp_alerts: []
      - eval_time: 4m
        alertname: ConnexServerErrorRateSpike
        exp_alerts: []
      - eval_time: 4m
        alertname: ConnexBackupFailure
        exp_alerts: []
      - eval_time: 4m
        alertname: ConnexAuditIntegrityAnomaly
        exp_alerts: []
      - eval_time: 4m
        alertname: ConnexMetricsUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: "up{job=\"connex\"}"
        values: "1+0x10"
      - series: "connex_security_authentication_failures_total{job=\"connex\",scope=\"workspace:7\"}"
        values: "20+0x4"
      - series: "connex_security_authentication_failures_total{job=\"connex\",scope=\"unattributed\"}"
        values: "80+0x4"
    alert_rule_test:
      - eval_time: 2m
        alertname: ConnexAuthenticationFailureTenantSpike
        exp_alerts:
          - exp_labels: {"severity": "warning", "scope": "workspace:7"}
            exp_annotations: {"summary": "At least 20 audited authentication failures in one tenant in 5 minutes"}
      - eval_time: 2m
        alertname: ConnexAuthenticationFailureGlobalSpike
        exp_alerts:
          - exp_labels: {"severity": "critical"}
            exp_annotations: {"summary": "At least 100 audited authentication failures globally in 5 minutes"}

  - name: missing backup metric despite healthy exporter
    interval: 1m
    input_series:
      - series: 'up{job="connex-backup"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnexBackupTelemetryUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Backup security metrics are unavailable}
  - name: failed backup scrape despite a retained healthy sample
    interval: 1m
    input_series:
      - series: 'up{job="connex-backup"}'
        values: '0+0x5'
      - series: 'connex_backup_failed{job="connex-backup"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnexBackupTelemetryUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Backup security metrics are unavailable}
  - name: backup telemetry entirely absent
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnexBackupTelemetryUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Backup security metrics are unavailable}
  - name: backup telemetry becomes stale
    interval: 1m
    input_series:
      - series: 'up{job="connex-backup"}'
        values: '1+0x5'
      - series: 'connex_backup_failed{job="connex-backup"}'
        values: '0 stale _ _ _ _'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnexBackupTelemetryUnavailable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: Backup security metrics are unavailable}
  - name: healthy backup telemetry
    interval: 1m
    input_series:
      - series: 'up{job="connex-backup"}'
        values: '1+0x5'
      - series: 'connex_backup_failed{job="connex-backup"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ConnexBackupTelemetryUnavailable
        exp_alerts: []
