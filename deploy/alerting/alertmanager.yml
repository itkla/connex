# Provision the operator-owned HTTPS notification gateway URL in a root-managed file.
# No URLs, credentials, SMTP addresses or customer labels belong in the rules.
route:
  receiver: security-oncall
  group_by: ['alertname', 'scope']
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: security-oncall
    webhook_configs:
      - url_file: /etc/connex-alerting/security-webhook-url
        send_resolved: true
        http_config:
          follow_redirects: false
