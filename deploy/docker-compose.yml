name: connex

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "${CONNEX_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: ghcr.io/itkla/connex-frontend@sha256:${CONNEX_FRONTEND_DIGEST:?set CONNEX_FRONTEND_DIGEST to the verified 64-character digest in deploy/.env}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/auth/login"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: ghcr.io/itkla/connex-backend@sha256:${CONNEX_BACKEND_DIGEST:?set CONNEX_BACKEND_DIGEST to the verified 64-character digest in deploy/.env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONNEX_DB_ROOT_PASSWORD: ""
      CONNEX_READINESS_FILE: /tmp/connex-ready
    volumes:
      - object_data:/var/lib/connex/objects
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/connex-ready"]
      interval: 5s
      timeout: 2s
      retries: 60
    networks:
      default:
        gw_priority: 1
      ocr_internal: {}

  ocr:
    image: ghcr.io/itkla/connex-ocr@sha256:${CONNEX_OCR_DIGEST:?set CONNEX_OCR_DIGEST to the verified 64-character digest in deploy/.env}
    profiles: ["ocr"]
    restart: unless-stopped
    environment:
      CONNEX_OCR_SERVICE_TOKEN: ${CONNEX_OCR_SERVICE_TOKEN:-}
      CONNEX_OCR_REQUEST_TIMEOUT_SECONDS: ${CONNEX_OCR_REQUEST_TIMEOUT_SECONDS:-12}
      CONNEX_OCR_STARTUP_TIMEOUT_SECONDS: ${CONNEX_OCR_STARTUP_TIMEOUT_SECONDS:-90}
      CONNEX_OCR_MAX_REQUEST_HANDLERS: ${CONNEX_OCR_MAX_REQUEST_HANDLERS:-8}
      CONNEX_OCR_MAX_IMAGE_BYTES: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_BYTES:-8388608}
      CONNEX_OCR_MAX_WIDTH: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_WIDTH:-8192}
      CONNEX_OCR_MAX_HEIGHT: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_HEIGHT:-8192}
      CONNEX_OCR_MAX_PIXELS: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_PIXELS:-24000000}
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    networks:
      - ocr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2)); raise SystemExit(0 if data.get('ready') is True else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 4

  db:
    image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
    restart: unless-stopped
    command: ["--log_bin_trust_function_creators=1"]
    environment:
      MYSQL_DATABASE: ${CONNEX_DB_NAME:-connexdb}
      MYSQL_USER: ${CONNEX_DB_USERNAME:-connexuser}
      MYSQL_PASSWORD: ${CONNEX_DB_PASSWORD:?set CONNEX_DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${CONNEX_DB_ROOT_PASSWORD:?set CONNEX_DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CONNEX_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  object_data:
  caddy_data:
  caddy_config:

networks:
  ocr_internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
