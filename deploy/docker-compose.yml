name: connex

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "${CONNEX_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CONNEX_CADDY_ADDITIONAL_TRUSTED_PROXIES: "${CONNEX_CADDY_ADDITIONAL_TRUSTED_PROXIES:-}"
      # HSTS is opt-in because local evaluation and private HTTP deployments share this listener.
      CONNEX_CADDY_HSTS_ENABLED: "${CONNEX_CADDY_HSTS_ENABLED:-false}"
      # Keep Caddy's public ceilings synchronized with the backend request-filter contracts.
      CONNEX_API_MAX_BODY_BYTES: "${CONNEX_API_MAX_BODY_BYTES:-10485760}"
      CONNEX_IMPORT_MAX_BODY_BYTES: "${CONNEX_IMPORT_MAX_BODY_BYTES:-67108864}"
      CONNEX_UPLOAD_MAX_BODY_BYTES: "${CONNEX_UPLOAD_MAX_BODY_BYTES:-28311552}"
      CONNEX_BUSINESS_CARD_MAX_BODY_BYTES: "${CONNEX_BUSINESS_CARD_MAX_BODY_BYTES:-12582912}"
      CONNEX_CLIENT_ERRORS_MAX_BODY_BYTES: "${CONNEX_CLIENT_ERRORS_MAX_BODY_BYTES:-16384}"
      CONNEX_WEBAUTHN_MAX_BODY_BYTES: "${CONNEX_WEBAUTHN_MAX_BODY_BYTES:-65536}"
      CONNEX_WORKFLOW_MAX_BODY_BYTES: "${CONNEX_WORKFLOW_MAX_BODY_BYTES:-98304}"
      CONNEX_FORM_MAX_BODY_BYTES: "${CONNEX_FORM_MAX_BODY_BYTES:-1048576}"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - edge

  frontend:
    image: ghcr.io/itkla/connex-frontend@sha256:${CONNEX_FRONTEND_DIGEST:?set CONNEX_FRONTEND_DIGEST to the verified 64-character digest in deploy/.env}
    restart: unless-stopped
    environment:
      API_URL: http://backend-app:8080
      CONNEX_CSP_MODE: ${CONNEX_CSP_MODE:-report-only}
      CONNEX_CSP_IMAGE_ORIGINS: ${CONNEX_CSP_IMAGE_ORIGINS:-}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/auth/login"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      edge: {}
      app:
        gw_priority: 1

  backend:
    image: ghcr.io/itkla/connex-backend@sha256:${CONNEX_BACKEND_DIGEST:?set CONNEX_BACKEND_DIGEST to the verified 64-character digest in deploy/.env}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONNEX_DB_ROOT_PASSWORD: ""
      CONNEX_READINESS_FILE: /tmp/connex-ready
      # Docker DNS tracks the two sanitizing peers without pinning install-specific bridge addresses.
      CONNEX_SECURITY_TRUSTED_PROXIES: "${CONNEX_SECURITY_TRUSTED_PROXIES:-caddy,frontend}"
      CONNEX_API_MAX_BODY_BYTES: "${CONNEX_API_MAX_BODY_BYTES:-10485760}"
      CONNEX_IMPORT_MAX_BODY_BYTES: "${CONNEX_IMPORT_MAX_BODY_BYTES:-67108864}"
      CONNEX_UPLOAD_MAX_BODY_BYTES: "${CONNEX_UPLOAD_MAX_BODY_BYTES:-28311552}"
      CONNEX_BUSINESS_CARD_MAX_BODY_BYTES: "${CONNEX_BUSINESS_CARD_MAX_BODY_BYTES:-12582912}"
      CONNEX_CLIENT_ERRORS_MAX_BODY_BYTES: "${CONNEX_CLIENT_ERRORS_MAX_BODY_BYTES:-16384}"
      CONNEX_WEBAUTHN_MAX_BODY_BYTES: "${CONNEX_WEBAUTHN_MAX_BODY_BYTES:-65536}"
      CONNEX_WORKFLOW_MAX_BODY_BYTES: "${CONNEX_WORKFLOW_MAX_BODY_BYTES:-98304}"
      CONNEX_FORM_MAX_BODY_BYTES: "${CONNEX_FORM_MAX_BODY_BYTES:-1048576}"
    volumes:
      - object_data:/var/lib/connex/objects
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/connex-ready"]
      interval: 5s
      timeout: 2s
      retries: 60
    networks:
      edge: {}
      app:
        gw_priority: 1
        aliases:
          - backend-app
      db: {}
      ocr_internal: {}
      clamav_internal: {}

  ocr:
    image: ghcr.io/itkla/connex-ocr@sha256:${CONNEX_OCR_DIGEST:?set CONNEX_OCR_DIGEST to the verified 64-character digest in deploy/.env}
    profiles: ["ocr"]
    restart: unless-stopped
    environment:
      CONNEX_OCR_SERVICE_TOKEN: ${CONNEX_OCR_SERVICE_TOKEN:-}
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "1"
      CONNEX_OCR_REQUEST_TIMEOUT_SECONDS: ${CONNEX_OCR_REQUEST_TIMEOUT_SECONDS:-12}
      CONNEX_OCR_STARTUP_TIMEOUT_SECONDS: ${CONNEX_OCR_STARTUP_TIMEOUT_SECONDS:-180}
      CONNEX_OCR_MAX_REQUEST_HANDLERS: ${CONNEX_OCR_MAX_REQUEST_HANDLERS:-8}
      CONNEX_OCR_MAX_IMAGE_BYTES: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_BYTES:-8388608}
      CONNEX_OCR_MAX_WIDTH: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_WIDTH:-8192}
      CONNEX_OCR_MAX_HEIGHT: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_HEIGHT:-8192}
      CONNEX_OCR_MAX_PIXELS: ${CONNEX_BUSINESS_CARD_IMAGE_MAX_PIXELS:-24000000}
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    networks:
      - ocr_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2)); raise SystemExit(0 if data.get('ready') is True else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 180s
      retries: 4

  clamav:
    image: ghcr.io/itkla/connex-clamav@sha256:${CONNEX_CLAMAV_DIGEST:?set CONNEX_CLAMAV_DIGEST to the verified 64-character digest in deploy/.env}
    # Unlike ocr, this profile is NOT optional in a real deployment. Malware scanning is a
    # mandatory control: with the backend configured for a deployment profile and this service
    # absent, every upload fails closed with 503. See docs/MALWARE_SCANNING.md.
    profiles: ["clamav"]
    restart: unless-stopped
    environment:
      CONNEX_CLAMAV_SERVICE_TOKEN: ${CONNEX_CLAMAV_SERVICE_TOKEN:-}
      CONNEX_CLAMAV_MAX_SCAN_BYTES: ${CONNEX_OBJECT_STORAGE_MAX_UPLOAD_BYTES:-26214400}
      CONNEX_CLAMAV_MAX_CONCURRENT_SCANS: ${CONNEX_CLAMAV_MAX_CONCURRENT_SCANS:-2}
      CONNEX_CLAMAV_SCAN_TIMEOUT_SECONDS: ${CONNEX_CLAMAV_SCAN_TIMEOUT_SECONDS:-40}
      CONNEX_CLAMAV_STARTUP_TIMEOUT_SECONDS: ${CONNEX_CLAMAV_STARTUP_TIMEOUT_SECONDS:-300}
      CONNEX_CLAMAV_MAX_REQUEST_HANDLERS: ${CONNEX_CLAMAV_MAX_REQUEST_HANDLERS:-8}
      CONNEX_CLAMAV_SIGNATURE_SOURCE: ${CONNEX_CLAMAV_SIGNATURE_SOURCE:-baked}
      CONNEX_CLAMAV_SIGNATURE_WARN_AGE_SECONDS: ${CONNEX_CLAMAV_SIGNATURE_WARN_AGE_SECONDS:-604800}
      CONNEX_CLAMAV_SIGNATURE_MAX_AGE_SECONDS: ${CONNEX_CLAMAV_SIGNATURE_MAX_AGE_SECONDS:-2592000}
    expose:
      - "8091"
    read_only: true
    # clamd does NOT scan an INSTREAM incrementally: it spools the submitted bytes to a temporary
    # file and unpacks archive members beside it. 512 MiB is derived arithmetic, not a guess --
    # max_concurrent_scans (2) x (clamd StreamMaxLength 32 MiB + MaxScanSize 192 MiB) = 448 MiB.
    # The sidecar refuses to start if this mount is smaller than that. Raising
    # CONNEX_CLAMAV_MAX_CONCURRENT_SCANS REQUIRES raising this size and mem_limit together.
    # The ocr service's 64 MiB is not a usable reference here.
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    # clamd holds the whole signature database resident (~2 GiB and growing), and tmpfs pages are
    # charged to this same memory cgroup, so the limit must cover both. An undersized limit shows
    # up as an OOM-killed container that looks exactly like a scanner outage.
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 128
    networks:
      - clamav_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=3)); raise SystemExit(0 if data.get('ready') is True else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 4

  db:
    image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
    restart: unless-stopped
    command: ["--log_bin_trust_function_creators=1", "--binlog_expire_logs_seconds=2505600"]
    environment:
      MYSQL_DATABASE: ${CONNEX_DB_NAME:-connexdb}
      MYSQL_USER: ${CONNEX_DB_USERNAME:-connexuser}
      MYSQL_PASSWORD: ${CONNEX_DB_PASSWORD:?set CONNEX_DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${CONNEX_DB_ROOT_PASSWORD:?set CONNEX_DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CONNEX_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - db

volumes:
  db_data:
  object_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  db:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  ocr_internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
  # The scanning path has no route off the host. Signature updates never traverse this network;
  # they are a build-time bake or an operator-mounted directory (docs/MALWARE_SCANNING.md).
  clamav_internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
