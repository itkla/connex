name: connex

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CONNEX_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    image: ghcr.io/itkla/connex-frontend:${CONNEX_VERSION:?set CONNEX_VERSION in deploy/.env}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    image: ghcr.io/itkla/connex-backend:${CONNEX_VERSION:?set CONNEX_VERSION in deploy/.env}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - object_data:/var/lib/connex/objects
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  ocr:
    image: ghcr.io/itkla/connex-ocr:${CONNEX_VERSION:?set CONNEX_VERSION in deploy/.env}
    profiles: ["ocr"]
    restart: unless-stopped
    environment:
      CONNEX_OCR_SERVICE_TOKEN: ${CONNEX_OCR_SERVICE_TOKEN:-}
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=2)); raise SystemExit(0 if data.get('ready') is True else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 4

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log_bin_trust_function_creators=1"]
    environment:
      MYSQL_DATABASE: ${CONNEX_DB_NAME:-connexdb}
      MYSQL_USER: ${CONNEX_DB_USERNAME:-connexuser}
      MYSQL_PASSWORD: ${CONNEX_DB_PASSWORD:?set CONNEX_DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${CONNEX_DB_ROOT_PASSWORD:?set CONNEX_DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CONNEX_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  object_data:
  caddy_data:
  caddy_config:
