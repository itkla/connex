spring.profiles.active=test
spring.datasource.url=${CONNEX_DB_URL:jdbc:mysql://localhost:3306/${CONNEX_DB_NAME:connexdb}?createDatabaseIfNotExist=true&sslMode=DISABLED}
spring.datasource.username=${CONNEX_DB_USERNAME}
spring.datasource.password=${CONNEX_DB_PASSWORD}
connex.notifications.scheduling-enabled=false
connex.cors.allowed-origins=http://localhost:3000,http://localhost:3001
connex.webauthn.allowed-origins=http://localhost:3000,http://localhost:3001
connex.sso.enabled=true
connex.sso.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
connex.mail.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
connex.secret-store.master-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
connex.audit.integrity.hmac-secret=test-audit-integrity-hmac-secret-change-me
connex.reports.scheduling-enabled=false
