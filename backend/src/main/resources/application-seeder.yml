spring:
    main:
        web-application-type: none
    sql:
        init:
            mode: never
            data-locations: optional:classpath:seeder-sql-init-canary.sql
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
    flyway:
        driver-class-name: com.mysql.cj.jdbc.Driver
        locations: classpath:db/migration
        callback-locations: []
        init-sqls: []
        placeholder-replacement: false

mybatis:
    mapper-locations: classpath:mappers/*.xml
    type-aliases-package: ooo.klae.connex.backend.beans
    configuration:
        map-underscore-to-camel-case: true

connex:
    maintenance:
        mode: seeder
    tenancy:
        routing:
            mode: single-database
    object-storage:
        legacy-migration:
            mode: "off"
    bootstrap:
        enabled: false
    notifications:
        scheduling-enabled: false
    rules:
        scheduling-enabled: false
    reports:
        scheduling-enabled: false
    mail:
        enabled: false
    password-reset:
        email-enabled: false
        scheduling-enabled: false
    email-change:
        email-enabled: false
        scheduling-enabled: false
    registration-verification:
        enabled: false
        email-enabled: false
        scheduling-enabled: false
    secret-store:
        master-key: ${CONNEX_SECRET_STORE_MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
        batch-rewrap-on-startup: false
    audit:
        integrity:
            hmac-secret: ${CONNEX_AUDIT_INTEGRITY_HMAC_SECRET:seeder-audit-integrity-hmac-secret}
