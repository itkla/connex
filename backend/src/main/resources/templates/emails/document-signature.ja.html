<!doctype html>
<html lang="ja">
  <head><meta charset="UTF-8"></head>
  <body style="font-family:'Hiragino Sans','Yu Gothic',Meiryo,sans-serif;color:#18181b;background:#f4f4f5;padding:32px">
    <main style="max-width:560px;margin:0 auto;background:#ffffff;padding:32px;border:1px solid #e4e4e7;border-radius:12px">
      <p style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#71717a">Connex</p>
      <h1 style="font-size:26px;line-height:1.45">{{documentTitle}} のご確認</h1>
      <p>{{recipientName}} 様</p>
      <p>ご確認とご承諾をお願いする書類が届いています。</p>
      <p>{{message}}</p>
      <p><a href="{{acceptanceUrl}}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px">書類を確認する</a></p>
      <p style="font-size:12px;color:#71717a;word-break:break-all">{{acceptanceUrl}}</p>
    </main>
  </body>
</html>
