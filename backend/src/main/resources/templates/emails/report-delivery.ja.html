<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="x-apple-disable-message-reformatting" />
  </head>
  <body style="background-color:#f4f4f5;margin:0;padding:0">
    <table border="0" width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tbody>
        <tr>
          <td style="padding:32px 0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Segoe UI',sans-serif">
            <table align="center" width="480" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width:100%;background-color:#ffffff;border-radius:12px;border:1px solid #e4e4e7">
              <tbody>
                <tr>
                  <td>
                    <p style="margin:0;padding:32px 40px 8px;font-size:12px;font-weight:700;color:#71717a;letter-spacing:0.12em;text-transform:uppercase">Connex Reports</p>
                    <h1 style="margin:8px 0 12px;padding:0 40px;font-size:28px;line-height:1.35;font-weight:600;color:#18181b">{{reportName}}</h1>
                    <p style="margin:0 0 20px;padding:0 40px;font-size:13px;line-height:1.5;color:#71717a">{{period}}</p>
                    <p style="margin:0 0 24px;padding:0 40px;font-size:15px;line-height:1.7;color:#52525b">{{summary}}</p>
                    <table align="center" width="400" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width:calc(100% - 80px);border:1px solid #e4e4e7;border-radius:10px">
                      <tbody>
                        <tr>
                          <td width="50%" style="padding:16px;vertical-align:top">
                            <p style="margin:0;font-size:12px;line-height:1.4;color:#71717a">{{headlineOneLabel}}</p>
                            <p style="margin:4px 0 0;font-size:20px;line-height:1.3;font-weight:600;color:#18181b">{{headlineOneValue}}</p>
                          </td>
                          <td width="50%" style="padding:16px;vertical-align:top">
                            <p style="margin:0;font-size:12px;line-height:1.4;color:#71717a">{{headlineTwoLabel}}</p>
                            <p style="margin:4px 0 0;font-size:20px;line-height:1.3;font-weight:600;color:#18181b">{{headlineTwoValue}}</p>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <p style="margin:24px 40px 32px">
                      <a href="{{actionUrl}}" target="_blank" style="display:inline-block;background-color:#18181b;color:#ffffff;font-size:15px;font-weight:600;line-height:1.2;text-decoration:none;padding:12px 24px;border-radius:8px">Connex で表示</a>
                    </p>
                  </td>
                </tr>
              </tbody>
            </table>
            <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#a1a1aa;text-align:center">このメールは、ワークスペースのレポート配信先に指定されているため送信されました。</p>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
