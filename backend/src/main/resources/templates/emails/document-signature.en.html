<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"></head>
  <body style="font-family:Arial,sans-serif;color:#18181b;background:#f4f4f5;padding:32px">
    <main style="max-width:560px;margin:0 auto;background:#ffffff;padding:32px;border:1px solid #e4e4e7;border-radius:12px">
      <p style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#71717a">Connex</p>
      <h1 style="font-size:26px;line-height:1.25">Review {{documentTitle}}</h1>
      <p>Hello {{recipientName}},</p>
      <p>You have received a commercial document for review and acceptance.</p>
      <p>{{message}}</p>
      <p><a href="{{acceptanceUrl}}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px">Review document</a></p>
      <p style="font-size:12px;color:#71717a;word-break:break-all">{{acceptanceUrl}}</p>
    </main>
  </body>
</html>
