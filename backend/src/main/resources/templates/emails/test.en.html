<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connex email test</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;border:1px solid #e4e4e7;overflow:hidden;">
            <tr>
              <td style="padding:32px 40px 8px 40px;">
                <div style="font-size:12px;font-weight:700;color:#71717a;letter-spacing:0.12em;text-transform:uppercase;">Connex</div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 40px 32px 40px;">
                <h1 style="margin:0 0 12px 0;font-size:28px;line-height:1.25;font-weight:600;color:#18181b;letter-spacing:-0.02em;">Your email settings work</h1>
                <p style="margin:0;font-size:15px;line-height:1.6;color:#52525b;">
                  This is a test message sent to {{recipient}}. If you're reading it, Connex can deliver email through your configured SMTP transport.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
