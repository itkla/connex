# Local development profile. Activate with SPRING_PROFILES_ACTIVE=dev (or
# ./gradlew bootRun --args='--spring.profiles.active=dev'). Loosens the fail-closed
# defaults that would otherwise break the plain-HTTP localhost workflow.
server:
    servlet:
        session:
            cookie:
                # The frontend proxies the session cookie over http://localhost, where a
                # Secure cookie would be dropped by the browser. Never enable dev in prod.
                secure: false

spring:
    datasource:
        url: ${CONNEX_DB_URL:jdbc:mysql://localhost:3306/${CONNEX_DB_NAME:connexdb}?createDatabaseIfNotExist=true&sslMode=DISABLED}
        username: ${CONNEX_DB_USERNAME}
        password: ${CONNEX_DB_PASSWORD}

connex:
    cors:
        allowed-origins: ${CONNEX_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    secret-store:
        master-key: ${CONNEX_SECRET_STORE_MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    webauthn:
        allowed-origins: ${CONNEX_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    workspace-cookie:
        secure: false
    audit:
        integrity:
            hmac-secret: ${CONNEX_AUDIT_INTEGRITY_HMAC_SECRET:dev-audit-integrity-hmac-secret-change-me}
