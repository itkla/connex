# spring.application.name=backend

spring:
    application:
        name: connex-backend
    datasource:
        url: jdbc:mysql://localhost:3306/connexdb
        username: connexuser
        password: connexpassword
        # driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            connection-init-sql: "SET time_zone = '+00:00'"
    sql:
        init:
            # mode: always
            encoding: UTF-8
    jackson:
        default-property-inclusion: non_null

connex:
    cors:
        allowed-origins: ${CONNEX_CORS_ALLOWED_ORIGINS:http://localhost:3000}

mybatis:
    mapper-locations: classpath:mappers/*.xml
    type-aliases-package: ooo.klae.connex.backend.beans
    configuration:
        map-underscore-to-camel-case: true
