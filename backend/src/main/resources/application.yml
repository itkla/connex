# spring.application.name=backend

spring:
    application:
        name: connex-backend
    datasource:
        url: ${CONNEX_DB_URL:jdbc:mysql://localhost:3306/connexdb?createDatabaseIfNotExist=true}
        username: ${CONNEX_DB_USERNAME:connexuser}
        password: ${CONNEX_DB_PASSWORD:connexpassword}
        # driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            connection-init-sql: "SET time_zone = '+00:00'"
    # Schema is owned by Flyway (classpath:db/migration). Legacy sql.init drop-and-recreate is off.
    sql:
        init:
            mode: never
            encoding: UTF-8
    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 0
    session:
        # Sessions are stored in MySQL via Spring Session JDBC. Flyway owns the schema
        # (V38), so Spring Session must not try to create it.
        jdbc:
            initialize-schema: never
    jackson:
        default-property-inclusion: non_null

connex:
    cors:
        allowed-origins: ${CONNEX_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    websocket:
        # Max concurrent realtime WebSocket connections per authenticated user on /api/ws.
        # Bounds an authenticated connection-flood on the shared single-JVM broker without
        # limiting normal multi-tab / multi-device use; excess sockets are closed on connect.
        max-sessions-per-user: ${CONNEX_WS_MAX_SESSIONS_PER_USER:10}
    workspaces:
        # When false, new registrations and the create endpoint cannot make workspaces
        # (invite-only mode); users onboard by accepting an invite instead.
        allow-self-service-creation: ${CONNEX_WORKSPACES_ALLOW_CREATION:true}
    bootstrap:
        # Provisions the first owner account + workspace on startup when the instance has zero
        # login-capable users (fresh self-host/on-prem deploy). Set enabled=true with username,
        # email, and password on first boot; ignored once any real user exists. The password is
        # read from the environment and is never logged.
        enabled: ${CONNEX_BOOTSTRAP_ENABLED:false}
        username: ${CONNEX_BOOTSTRAP_USERNAME:}
        email: ${CONNEX_BOOTSTRAP_EMAIL:}
        password: ${CONNEX_BOOTSTRAP_PASSWORD:}
        display-name: ${CONNEX_BOOTSTRAP_DISPLAY_NAME:}
        timezone: ${CONNEX_BOOTSTRAP_TIMEZONE:UTC}
    signup:
        # Self-service registration mode. 'open' (default) lets anyone register and create their own
        # workspace. 'invite' / 'domain' (reserved for locked-down on-prem) disable open self-service
        # signup so users onboard via invites instead. Read in AuthService.register.
        mode: ${CONNEX_SIGNUP_MODE:open}
        # Instance-wide allowed email domains (CSV), reserved for the future 'domain' signup mode.
        allowed-domains: ${CONNEX_SIGNUP_ALLOWED_DOMAINS:}
    tenancy:
        # Fail-closed MyBatis backstop: rejects workspace-scoped queries that run
        # without a resolved tenant context. Disable only to debug isolation issues.
        enforce-scope: ${CONNEX_TENANCY_ENFORCE_SCOPE:true}
    security:
        # CSRF protection for state-changing requests. The SPA fetches the token from
        # GET /api/auth/csrf and echoes it in the X-XSRF-TOKEN header. Kill-switch for cutover.
        csrf-enabled: ${CONNEX_SECURITY_CSRF_ENABLED:true}
        # Comma-separated trusted reverse-proxy IPs / CIDR ranges. X-Forwarded-For is
        # only honored when the direct peer matches one of these; empty (the default)
        # means the header is never trusted, so a client cannot spoof its source IP for
        # rate-limiting or audit attribution. IMPORTANT: set this to your proxy/CDN/tunnel
        # egress ranges in any proxied deployment — otherwise every request appears to come
        # from the proxy's own address and per-IP attribution is worthless. (The login
        # per-IP throttle already self-disables when the resolved IP is loopback/private,
        # so a mis-config degrades to per-username throttling rather than a global lockout,
        # but per-IP protection and accurate audit IPs both require this to be set.)
        trusted-proxies: ${CONNEX_SECURITY_TRUSTED_PROXIES:}
    login:
        # Fixed-window failed-attempt throttle on POST /api/auth/login. Once either the
        # per-IP or per-username failure cap is hit within the window, further attempts are
        # rejected until the window elapses. In-memory / single-JVM, matching the session model.
        # The per-username cap is a deliberate temporary lockout that bounds targeted brute
        # force; it self-heals after window-seconds and a successful login clears the bucket.
        # The per-IP cap only engages for a real public client IP (see trusted-proxies above).
        max-failures-per-ip: ${CONNEX_LOGIN_MAX_FAILURES_PER_IP:50}
        max-failures-per-user: ${CONNEX_LOGIN_MAX_FAILURES_PER_USER:10}
        window-seconds: ${CONNEX_LOGIN_WINDOW_SECONDS:900}
    webauthn:
        # Passkey / WebAuthn relying-party config (#295). rp-id is the site's registrable domain
        # (no scheme/port); allowed-origins (CSV) must list every origin the SPA is served from.
        # These differ per environment (localhost in dev, the staging/production hostnames
        # otherwise), so always override them in any deployed instance.
        rp-id: ${CONNEX_WEBAUTHN_RP_ID:localhost}
        rp-name: ${CONNEX_WEBAUTHN_RP_NAME:Connex}
        allowed-origins: ${CONNEX_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:3000}
    sso:
        # Instance-level kill switch for the whole SSO subsystem (#296). Default false so a
        # deployment ships with OIDC/SAML dormant; set true only where enterprise SSO is offered.
        enabled: ${CONNEX_SSO_ENABLED:false}
        # Per-organization enterprise SSO/IdP (#296). secret-key is a Base64 AES key
        # (16/24/32 bytes) that encrypts each org's OIDC client secret at rest; it is
        # required only once an org stores a client secret, and rotating it invalidates
        # previously stored secrets.
        secret-key: ${CONNEX_SSO_SECRET_KEY:}
        # Whether an OIDC issuer may resolve to a loopback/private address. Defaults false so the
        # server-side discovery fetch cannot be aimed at internal services or the cloud metadata
        # endpoint (SSRF). Set true only when the IdP is genuinely on-premises on a private network.
        allow-private-issuer-hosts: ${CONNEX_SSO_ALLOW_PRIVATE_ISSUER_HOSTS:false}
    sharing:
        # Gates the cross-workspace share/unshare API. The owned-or-shared read predicate is always
        # applied (harmless when no shares exist).
        enabled: ${CONNEX_SHARING_ENABLED:true}
    notifications:
        scheduling-enabled: ${CONNEX_NOTIFICATIONS_SCHEDULING_ENABLED:true}
        reconciliation-delay-ms: ${CONNEX_NOTIFICATIONS_RECONCILIATION_DELAY_MS:300000}
        initial-delay-ms: ${CONNEX_NOTIFICATIONS_INITIAL_DELAY_MS:300000}
        overdue-backfill-days: ${CONNEX_NOTIFICATIONS_OVERDUE_BACKFILL_DAYS:30}
        retention-days: ${CONNEX_NOTIFICATIONS_RETENTION_DAYS:90}
        max-page-size: ${CONNEX_NOTIFICATIONS_MAX_PAGE_SIZE:100}
    rules:
        scheduling-enabled: ${CONNEX_RULES_SCHEDULING_ENABLED:true}
        evaluation-delay-ms: ${CONNEX_RULES_EVALUATION_DELAY_MS:900000}
        initial-delay-ms: ${CONNEX_RULES_INITIAL_DELAY_MS:900000}
    mail:
        # Instance-wide SMTP transport. enabled=true wires the default sender and lets
        # workspace invites be emailed; it is also the transport that the account-level
        # flows use once THEY are switched on via their own flags below
        # (password-reset.email-enabled / email-change.email-enabled) — enabling mail alone
        # does NOT start sending reset/verification mail. It is the fallback sender for
        # workspaces without their own SMTP. A workspace can override host/from via
        # Settings → Email; its SMTP password is AES/GCM-encrypted at rest with secret-key.
        # app-base-url is the frontend origin used to build invite links (never a request header).
        enabled: ${CONNEX_MAIL_ENABLED:false}
        host: ${CONNEX_MAIL_HOST:}
        port: ${CONNEX_MAIL_PORT:587}
        username: ${CONNEX_MAIL_USERNAME:}
        password: ${CONNEX_MAIL_PASSWORD:}
        from: ${CONNEX_MAIL_FROM:}
        from-name: ${CONNEX_MAIL_FROM_NAME:Connex}
        starttls: ${CONNEX_MAIL_STARTTLS:true}
        ssl: ${CONNEX_MAIL_SSL:false}
        auth: ${CONNEX_MAIL_AUTH:true}
        connection-timeout-ms: ${CONNEX_MAIL_CONNECTION_TIMEOUT_MS:10000}
        timeout-ms: ${CONNEX_MAIL_TIMEOUT_MS:10000}
        write-timeout-ms: ${CONNEX_MAIL_WRITE_TIMEOUT_MS:10000}
        # Base64 AES key (16/24/32 bytes) for encrypting per-workspace SMTP passwords.
        # Required once a workspace stores its own password; rotating it invalidates them.
        secret-key: ${CONNEX_MAIL_SECRET_KEY:}
        app-base-url: ${CONNEX_MAIL_APP_BASE_URL:http://localhost:3000}
        # Allow workspace-supplied SMTP hosts that resolve to private/loopback/link-local
        # addresses. Off by default (blocks SSRF probing); enable for on-prem internal relays.
        allow-internal-hosts: ${CONNEX_MAIL_ALLOW_INTERNAL_HOSTS:false}
    password-reset:
        # Forgot-password flow. token-expiry-minutes bounds how long a reset link is
        # valid; email-enabled=true sends real reset mail over the connex.mail.* transport
        # (configure that too), while false keeps the dev fallback that only logs the link.
        # base-url is the frontend origin used to build the reset link (never derived from a
        # request header). request-window-seconds / max-requests cap how many reset links one
        # account can request in that window.
        token-expiry-minutes: ${CONNEX_PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:30}
        email-enabled: ${CONNEX_PASSWORD_RESET_EMAIL_ENABLED:false}
        # Dev-only: log the raw reset link. Never enable where logs are accessible.
        log-link: ${CONNEX_PASSWORD_RESET_LOG_LINK:false}
        base-url: ${CONNEX_PASSWORD_RESET_BASE_URL:http://localhost:3000}
        # Per-account request throttle (enumeration-safe branch is also covered by the per-IP cap).
        request-window-seconds: ${CONNEX_PASSWORD_RESET_REQUEST_WINDOW_SECONDS:900}
        max-requests: ${CONNEX_PASSWORD_RESET_MAX_REQUESTS:5}
        # Per-IP throttle spanning the same window, applied before the account lookup so probing
        # unknown emails is bounded too.
        max-requests-per-ip: ${CONNEX_PASSWORD_RESET_MAX_REQUESTS_PER_IP:20}
        scheduling-enabled: ${CONNEX_PASSWORD_RESET_SCHEDULING_ENABLED:true}
        cleanup-delay-ms: ${CONNEX_PASSWORD_RESET_CLEANUP_DELAY_MS:3600000}
        initial-delay-ms: ${CONNEX_PASSWORD_RESET_INITIAL_DELAY_MS:3600000}
    email-change:
        # Verified account email-change flow. A change is applied only after the
        # recipient redeems a single-use token sent to the new address; email-enabled=true
        # sends real verification mail over the connex.mail.* transport (configure that too),
        # while false keeps the dev fallback that only logs the link. base-url is the frontend
        # origin used to build the verification link (never derived from a request header).
        # request-window-seconds / max-requests cap how many changes one account can request
        # in that window; the raw token is never stored (only its SHA-256 hash).
        token-expiry-minutes: ${CONNEX_EMAIL_CHANGE_TOKEN_EXPIRY_MINUTES:30}
        email-enabled: ${CONNEX_EMAIL_CHANGE_EMAIL_ENABLED:false}
        # Dev-only: log the raw verification link. Never enable where logs are accessible.
        log-link: ${CONNEX_EMAIL_CHANGE_LOG_LINK:false}
        base-url: ${CONNEX_EMAIL_CHANGE_BASE_URL:http://localhost:3000}
        request-window-seconds: ${CONNEX_EMAIL_CHANGE_REQUEST_WINDOW_SECONDS:900}
        max-requests: ${CONNEX_EMAIL_CHANGE_MAX_REQUESTS:5}
        scheduling-enabled: ${CONNEX_EMAIL_CHANGE_SCHEDULING_ENABLED:true}
        cleanup-delay-ms: ${CONNEX_EMAIL_CHANGE_CLEANUP_DELAY_MS:3600000}
        initial-delay-ms: ${CONNEX_EMAIL_CHANGE_INITIAL_DELAY_MS:3600000}
    registration-verification:
        # Registration email verification. When enabled, new self-service registrations start
        # unverified and are emailed a link to prove they control their address; joining a
        # domain-restricted workspace via a shareable invite link then requires a verified email,
        # so the workspace domain allow-list can no longer be satisfied by an unverified (spoofable)
        # registration address. Off by default (fully non-breaking): no tokens are issued and the
        # redeem gate does not apply. email-enabled=true sends real mail over connex.mail.*; false
        # keeps the dev fallback that only logs the link. base-url is the frontend origin used to
        # build the link (never derived from a request header).
        enabled: ${CONNEX_REGISTRATION_VERIFICATION_ENABLED:false}
        token-expiry-minutes: ${CONNEX_REGISTRATION_VERIFICATION_TOKEN_EXPIRY_MINUTES:1440}
        email-enabled: ${CONNEX_REGISTRATION_VERIFICATION_EMAIL_ENABLED:false}
        # Dev-only: log the raw verification link. Never enable where logs are accessible.
        log-link: ${CONNEX_REGISTRATION_VERIFICATION_LOG_LINK:false}
        base-url: ${CONNEX_REGISTRATION_VERIFICATION_BASE_URL:http://localhost:3000}
        request-window-seconds: ${CONNEX_REGISTRATION_VERIFICATION_REQUEST_WINDOW_SECONDS:900}
        max-requests: ${CONNEX_REGISTRATION_VERIFICATION_MAX_REQUESTS:5}
        scheduling-enabled: ${CONNEX_REGISTRATION_VERIFICATION_SCHEDULING_ENABLED:true}
        cleanup-delay-ms: ${CONNEX_REGISTRATION_VERIFICATION_CLEANUP_DELAY_MS:3600000}
        initial-delay-ms: ${CONNEX_REGISTRATION_VERIFICATION_INITIAL_DELAY_MS:3600000}

mybatis:
    mapper-locations: classpath:mappers/*.xml
    type-aliases-package: ooo.klae.connex.backend.beans
    configuration:
        map-underscore-to-camel-case: true

server:
    servlet:
        session:
            cookie:
                # Keep the JSESSIONID name after moving to Spring Session (which otherwise defaults
                # the cookie to SESSION); frontend/proxy.ts gates protected routes on JSESSIONID.
                name: JSESSIONID
                http-only: true
                same-site: lax
                # Fail closed: the session cookie carries the Secure attribute by default, so an
                # HTTPS deployment that forgets to configure this still never emits JSESSIONID over
                # plaintext HTTP. Local HTTP dev opts out via the `dev` profile (application-dev.yml).
                secure: ${CONNEX_SESSION_COOKIE_SECURE:true}
