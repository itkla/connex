# spring.application.name=backend

spring:
    application:
        name: connex-backend
    datasource:
        url: jdbc:mysql://localhost:3306/connexdb?createDatabaseIfNotExist=true
        username: connexuser
        password: connexpassword
        # driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            connection-init-sql: "SET time_zone = '+00:00'"
    # Schema is owned by Flyway (classpath:db/migration). Legacy sql.init drop-and-recreate is off.
    sql:
        init:
            mode: never
            encoding: UTF-8
    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 0
    jackson:
        default-property-inclusion: non_null

connex:
    cors:
        allowed-origins: ${CONNEX_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    notifications:
        scheduling-enabled: ${CONNEX_NOTIFICATIONS_SCHEDULING_ENABLED:true}
        reconciliation-delay-ms: ${CONNEX_NOTIFICATIONS_RECONCILIATION_DELAY_MS:300000}
        initial-delay-ms: ${CONNEX_NOTIFICATIONS_INITIAL_DELAY_MS:300000}
        overdue-backfill-days: ${CONNEX_NOTIFICATIONS_OVERDUE_BACKFILL_DAYS:30}
        retention-days: ${CONNEX_NOTIFICATIONS_RETENTION_DAYS:90}
        max-page-size: ${CONNEX_NOTIFICATIONS_MAX_PAGE_SIZE:100}

mybatis:
    mapper-locations: classpath:mappers/*.xml
    type-aliases-package: ooo.klae.connex.backend.beans
    configuration:
        map-underscore-to-camel-case: true
