version=0.0.1-SNAPSHOT
# javac runs inside the Gradle daemon. compileTestJava keeps about 1.1 GiB live, so the 512 MiB
# default heap ends in "garbage collector is thrashing" on CI. Setting jvmargs replaces Gradle's
# defaults, which is why the metaspace cap and heap-dump flag are restated here.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
