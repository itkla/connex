buildscript {
	// The Spring Boot Gradle plugin pulls spring-boot-buildpack-platform, whose POM pins
	// httpclient5 5.6.1 -> httpcore5 5.4 onto the PLUGIN classpath. Project-level
	// dependencyManagement (ext overrides below) cannot reach that configuration, so the
	// dependency-submission graph kept reporting the vulnerable declared nodes and Dependabot
	// alerts #113/#114/#117 stayed open after PR #1552. Build-time tooling only - never shipped -
	// but constrained here so the submitted graph carries no vulnerable node at all.
	configurations.classpath {
		resolutionStrategy {
			force 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
			force 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
			force 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
		}
	}
}

plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ooo.klae.connex'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

springBoot {
	buildInfo {
		def releaseBuildTime = providers.gradleProperty('buildTime')
		if (releaseBuildTime.isPresent()) {
			properties {
				time.set(releaseBuildTime)
			}
		}
		def gitSha = providers.gradleProperty('gitSha')
		if (!gitSha.isPresent() && new File(projectDir.parentFile, '.git').exists()) {
			gitSha = providers.exec {
				commandLine 'git', 'rev-parse', 'HEAD'
				ignoreExitValue = true
			}.standardOutput.asText.map { it.trim() }
		}
		properties {
			additional.put('gitSha', gitSha.map { sha -> sha.isEmpty() ? 'unknown' : sha }.orElse('unknown'))
		}
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'shibboleth'
		url = 'https://build.shibboleth.net/maven/releases/'
		content {
			includeGroupByRegex 'org\\.opensaml.*'
			includeGroupByRegex 'net\\.shibboleth.*'
		}
	}
}

ext['tomcat.version'] = '11.0.23'
ext['jackson-2-bom.version'] = '2.21.5'
ext['jackson-bom.version'] = '3.1.5'
ext['logback.version'] = '1.5.35'

// Spring Boot 4.1.0 manages these below their patched versions (netty 4.2.15.Final,
// log4j2 2.25.4, httpcore5 5.4.2, httpclient5 5.6.1) and pins httpclient5 downward from
// what the AWS SDK requests. These overrides raise them past the advisories tracked in #1379;
// removing one silently reintroduces a known CVE.
ext['netty.version'] = '4.2.17.Final'
ext['log4j2.version'] = '2.25.5'
ext['httpcore5.version'] = '5.4.3'
ext['httpclient5.version'] = '5.6.4'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.36'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	implementation 'org.springframework.boot:spring-boot-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.security:spring-security-saml2-service-provider'
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.14.0'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.14.0'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation("org.springframework.data:spring-data-commons:4.1.0")
	implementation 'org.springframework.security:spring-security-webauthn'
	implementation 'org.springframework.security:spring-security-messaging'
	implementation platform('software.amazon.awssdk:bom:2.51.3')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
	testImplementation 'com.webauthn4j:webauthn4j-test:0.31.9.RELEASE'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.1.0'
	testCompileOnly 'io.micrometer:micrometer-registry-prometheus'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
	options.encoding = 'UTF-8'
}

// The scripted trajectory harness is the one test context that activates the ai-scripted-provider
// Spring profile, so it is a context key nothing else in the suite shares. It runs in its own fork
// with its own context cache and connection budget instead of evicting a hot context out of the
// shared one. The required Backend CI path names `scriptedTrajectoryTest` alongside the DB shards:
// a task nothing runs proves nothing.
def scriptedTrajectoryPattern = '**/*ScriptedTrajectory*Test.class'

// Parse once at configuration time so all CI tasks share the same source inventory. The JDK parser
// distinguishes top-level classes from nested fixtures, comments and text blocks without loading
// test classes or resolving their dependencies. Abstract harnesses contribute inherited markers,
// but JUnit does not run them as test classes in their own right.
def testSources = [:]
def testCompiler = javax.tools.ToolProvider.systemJavaCompiler
def parseDiagnostics = new javax.tools.DiagnosticCollector<javax.tools.JavaFileObject>()
testCompiler.getStandardFileManager(parseDiagnostics, null, java.nio.charset.StandardCharsets.UTF_8).withCloseable { manager ->
	def sources = manager.getJavaFileObjectsFromFiles(fileTree('src/test/java') {
		include '**/*.java'
	}.files.sort())
	def compilation = testCompiler.getTask(null, manager, parseDiagnostics, ['-proc:none'], null, sources)
	compilation.parse().each { unit ->
		def source = unit.sourceFile.getCharContent(true).toString()
		def packageName = unit.packageName?.toString() ?: ''
		def imports = unit.imports.findAll { !it.static }.collect { it.qualifiedIdentifier.toString() }
		unit.typeDecls.findAll { it.kind == com.sun.source.tree.Tree.Kind.CLASS }.each { declaration ->
			def name = declaration.simpleName.toString()
			def qualifiedName = packageName ? "${packageName}.${name}".toString() : name
			testSources[qualifiedName] = [
				source: source,
				packageName: packageName,
				imports: imports,
				superclass: declaration.extendsClause?.toString()?.replaceAll(/<.*>/, ''),
				runnable: unit.sourceFile.name ==~ /.*Tests?\.java/ &&
					!declaration.modifiers.flags.contains(javax.lang.model.element.Modifier.ABSTRACT)
			]
		}
	}
}
def parseErrors = parseDiagnostics.diagnostics.findAll { it.kind == javax.tools.Diagnostic.Kind.ERROR }
if (!parseErrors.empty) {
	throw new GradleException("Cannot partition test sources: ${parseErrors.join('\n')}")
}

def databaseMarkers = [
	'@SpringBootTest', '@WebMvcTest', '@SpringJUnitConfig', '@SpringJUnitWebConfig',
	'@ContextConfiguration', '@DataJdbcTest', '@MybatisTest', 'DriverManager', 'CONNEX_DB_',
	'DataSource', 'JdbcTemplate', 'HikariDataSource', '@Sql', 'TestTransaction', '@Transactional'
]
def databaseClassification = [:]
def isDatabaseBacked
isDatabaseBacked = { String name, Set visiting ->
	if (databaseClassification.containsKey(name)) {
		return databaseClassification[name]
	}
	def source = testSources[name]
	if (source == null || !visiting.add(name)) {
		return true
	}
	def backed = databaseMarkers.any { source.source.contains(it) }
	if (!backed && source.superclass != null) {
		def parent = source.superclass
		def candidates = [parent, "${source.packageName}.${parent}".toString()]
		source.imports.each { imported ->
			if (imported.endsWith(".${parent}")) {
				candidates.add(imported)
			} else if (imported.endsWith('.*')) {
				candidates.add(imported.dropRight(1) + parent)
			}
		}
		def parents = candidates.findAll { testSources.containsKey(it) }.toSet()
		// Unresolved, ambiguous or cyclic inheritance is not evidence that a test is DB-free.
		backed = parents.size() != 1 || isDatabaseBacked(parents.first(), visiting)
	}
	visiting.remove(name)
	databaseClassification[name] = backed
	return backed
}
def fullTestClasses = testSources.findAll { name, source -> source.runnable }.keySet().toSorted()
def testPartition = [unitTest: new TreeSet(), dbTestShard1: new TreeSet(),
	dbTestShard2: new TreeSet(), scriptedTrajectoryTest: new TreeSet()]
fullTestClasses.each { name ->
	def classPath = name.replace('.', '/') + '.class'
	if (org.apache.tools.ant.types.selectors.SelectorUtils.matchPath(scriptedTrajectoryPattern, classPath)) {
		testPartition.scriptedTrajectoryTest.add(name)
	} else if (!isDatabaseBacked(name, new HashSet())) {
		testPartition.unitTest.add(name)
	} else if (classPath.startsWith('ooo/klae/connex/backend/services/')) {
		testPartition.dbTestShard1.add(name)
	} else {
		testPartition.dbTestShard2.add(name)
	}
}

tasks.register('verifyTestPartition') {
	group = 'verification'
	description = 'Checks that every backend test class belongs to exactly one non-empty CI partition.'
	dependsOn tasks.named('testClasses')
	doLast {
		// Verify compiled carriers independently of the naming convention used to assign sources.
		// An executable FooSpec (including inherited or nested tests) must fail closed, not vanish
		// from both the partition and the inventory that is supposed to check its coverage.
		def descriptors = [
			'Lorg/junit/jupiter/api/Test;', 'Lorg/junit/jupiter/params/ParameterizedTest;',
			'Lorg/junit/jupiter/api/RepeatedTest;', 'Lorg/junit/jupiter/api/TestFactory;',
			'Lorg/junit/jupiter/api/TestTemplate;', 'Lorg/junit/jupiter/api/Nested;'
		]
		def compiledClasses = [:]
		def classNamesByFile = [:]
		sourceSets.test.output.classesDirs.asFileTree.matching { include '**/*.class' }.each { file ->
			def bytes = file.bytes
			def model = java.lang.classfile.ClassFile.of().parse(bytes)
			def name = model.thisClass().asInternalName()
			def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
			compiledClasses[name] = [
				superclass: model.superclass().orElse(null)?.asInternalName(),
				carrier: descriptors.any { constants.contains(it) },
				concrete: !model.flags().has(java.lang.reflect.AccessFlag.ABSTRACT)
			]
			classNamesByFile[file] = name
		}
		def carriers = compiledClasses.findAll { name, model -> model.carrier }.keySet().toSet()
		def inherited
		do {
			inherited = compiledClasses.findAll { name, model ->
				!carriers.contains(name) && carriers.contains(model.superclass)
			}.keySet()
			carriers.addAll(inherited)
		} while (!inherited.empty)
		// Abstract harnesses supply inherited tests but cannot run independently under Jupiter.
		def executableCarriers = carriers.findAll { compiledClasses[it].concrete }.toSet()
		def ownerNames = executableCarriers.collect { it.split(/\$/)[0] }.toSet()
		def executableOwners = ownerNames.collect { it.replace('/', '.') }.toSorted().toSet()
		// A selected outer container discovers its nested tests, but unrelated helper inners cannot
		// stand in for an excluded test carrier merely because they share its top-level owner.
		def selectableClasses = executableCarriers + ownerNames
		def selections = ['unitTest', 'dbTestShard1', 'dbTestShard2', 'scriptedTrajectoryTest']
			.collectEntries { taskName ->
				// Gradle's candidate tree applies the task's actual include/exclude patterns.
				def selectedOwners = tasks.named(taskName, Test).get().candidateClassFiles.files
					.collect { classNamesByFile[it] }.findAll { selectableClasses.contains(it) }
					.collect { it.split(/\$/)[0].replace('/', '.') }.toSet()
				[(taskName): selectedOwners]
			}
		def selected = selections.values().flatten()
		def duplicates = selected.countBy { it }.findAll { name, count -> count > 1 }.keySet().toSorted()
		def missing = executableOwners - selected
		def empty = selections.findAll { name, classes -> classes.empty }.keySet()
		logger.lifecycle("Test partition: total=${executableOwners.size()}, " + selections.collect {
			name, classes -> "${name}=${classes.size()}"
		}.join(', '))
		if (duplicates || missing || empty) {
			throw new GradleException("Invalid compiled test partition: missing=${missing}, " +
				"overlapping=${duplicates}, empty=${empty}")
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Ten cached contexts plus one loading sat at the edge of 2048m: adding any test class shifts the
	// 100-class fork windows and the storage fork then fails with OutOfMemoryError while loading its
	// context. The hosted runner has 16 GB, so the fork gets headroom instead of fragile window luck.
	maxHeapSize = '3072m'
	maxParallelForks = 1
	forkEvery = 100
	// One test fork retains at most 10 cached pools. Including one context loading, the application-pool
	// budget is (10 + 1) * 10 = 110, leaving 41 of MySQL's default 151 for auxiliary test connections.
	systemProperty 'spring.test.context.cache.maxSize', '10'
	exclude scriptedTrajectoryPattern
}

tasks.register('scriptedTrajectoryTest', Test) {
	group = 'verification'
	description = 'Runs scripted agent trajectories end to end against the scripted AI provider.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	maxHeapSize = '2048m'
	maxParallelForks = 1
	include scriptedTrajectoryPattern
	systemProperty 'spring.test.context.cache.maxSize', '2'
}

// `test` no longer covers the trajectory goldens, so every lifecycle entry point that used to run
// them through `test` has to name the new task or it silently runs a smaller suite than CI and
// still reports success. ScriptedAiProviderArchTest pins this line and the CI step together.
tasks.named('check') {
	dependsOn 'scriptedTrajectoryTest'
}

def seederRuntimeClasspath = sourceSets.main.output + configurations.productionRuntimeClasspath

tasks.register('seedData', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Seeds deterministic tenant-scoped CRM data into a guarded database.'
	mainClass = 'ooo.klae.connex.backend.seeder.SeederApplication'
	classpath = seederRuntimeClasspath
	args '--spring.main.web-application-type=none',
		'--spring.profiles.active=seeder',
		'--connex.seeder.enabled=true'
	[
		seederProfile: 'profile',
		seederSeed: 'seed',
		seederWorkspaces: 'workspaces',
		seederAnchorDate: 'anchor-date',
		seederAllowRemoteHost: 'allow-remote-host'
	].each { projectProperty, applicationProperty ->
		def propertyValue = providers.gradleProperty(projectProperty)
		if (propertyValue.isPresent()) {
			args "--connex.seeder.${applicationProperty}=${propertyValue.get()}"
		}
	}
}

def verifySeederDevtoolsIsolation = tasks.register(
	'verifySeederDevtoolsIsolation',
	JavaExec
) {
	group = 'verification'
	description = 'Proves the seeder runtime ignores Spring DevTools home configuration.'
	dependsOn tasks.named('testClasses')
	mainClass = 'ooo.klae.connex.backend.seeder.SeederDevToolsIsolationProbe'
	classpath = sourceSets.test.output + seederRuntimeClasspath
	doFirst {
		def devtoolsArtifacts = classpath.files.findAll {
			it.name.startsWith('spring-boot-devtools-')
		}
		if (!devtoolsArtifacts.isEmpty()) {
			throw new GradleException('Seeder verification classpath contains Spring DevTools')
		}
		def devtoolsConfigDirectory = new File(
			temporaryDir,
			'.config/spring-boot'
		)
		if (!devtoolsConfigDirectory.mkdirs() && !devtoolsConfigDirectory.isDirectory()) {
			throw new GradleException('Cannot create the seeder DevTools probe directory')
		}
		new File(
			devtoolsConfigDirectory,
			'spring-boot-devtools.properties'
		).text = 'context.initializer.classes=ooo.klae.connex.backend.seeder.SeederDevToolsIsolationProbe$CanaryInitializer\n'
		environment 'SPRING_DEVTOOLS_HOME', temporaryDir.absolutePath
	}
}

tasks.named('test') {
	dependsOn verifySeederDevtoolsIsolation
}

tasks.register('generateApiSurface', JavaExec) {
	group = 'documentation'
	description = 'Regenerates the reviewed HTTP surface and authorization evidence ledgers.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'ooo.klae.connex.backend.apisurface.ApiSurfaceInventory'
}

tasks.named('test') {
	inputs.files(fileTree('src/main/java') { include '**/*.java' })
	inputs.files('build.gradle', '../frontend/next.config.ts',
		'../docs/backend/api-surface.tsv', '../docs/backend/api-surface-policy.txt',
		'../docs/backend/api-lifecycle.tsv')
	inputs.property('apiLifecycleDate', java.time.LocalDate.now(java.time.ZoneOffset.UTC).toString())
}

// The new CI tasks retain the local test task's system properties, source/ledger/date inputs and
// seeder isolation probe. Otherwise a split could silently drop that guard or reuse stale results.
['unitTest', 'dbTestShard1', 'dbTestShard2'].each { taskName ->
	tasks.register(taskName, Test) {
		def localTest = tasks.named('test', Test).get()
		group = 'verification'
		description = taskName == 'unitTest' ? 'Runs DB-free backend tests.' :
			"Runs isolated backend database shard ${taskName.takeRight(1)} of 2."
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform()
		systemProperties localTest.systemProperties
		inputs.files(fileTree('src/main/java') { include '**/*.java' })
		inputs.files('build.gradle', '../frontend/next.config.ts',
			'../docs/backend/api-surface.tsv', '../docs/backend/api-surface-policy.txt',
			'../docs/backend/api-lifecycle.tsv')
		inputs.property('apiLifecycleDate', java.time.LocalDate.now(java.time.ZoneOffset.UTC).toString())
		dependsOn verifySeederDevtoolsIsolation
		forkEvery = localTest.forkEvery
		exclude scriptedTrajectoryPattern
		// Exact outer names plus their nested classes avoid prefix collisions between partitions.
		setIncludes(testPartition[taskName].collectMany { name ->
			def path = name.replace('.', '/')
			[path + '.class', path + '$*.class']
		})
		if (taskName == 'unitTest') {
			// Two DB-free forks share the old heap budget. Non-empty, unusable credentials turn
			// accidental DB dependencies into failures instead of missing-credential skips.
			maxParallelForks = 2
			maxHeapSize = '1536m'
			environment 'CONNEX_DB_URL', 'jdbc:mysql://127.0.0.1:1/no_database_in_unit_task'
			environment 'CONNEX_DB_USERNAME', 'unit-task-has-no-database'
			environment 'CONNEX_DB_PASSWORD', 'unit-task-has-no-database'
		} else {
			// Each shard has its own MySQL service in CI. Keep the serial fork and ten-context
			// cache budget: two DB forks against one service would exceed its connection cap.
			maxParallelForks = localTest.maxParallelForks
			maxHeapSize = localTest.maxHeapSize
		}
	}
}
